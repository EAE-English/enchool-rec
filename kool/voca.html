<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>쿨보카</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gaegu:wght@400;700&display=swap">
<style>
/* 기적영트와 같은 엔쿨 톤: 네이비 머리글 + 크림 바탕 + 골드 포인트. 대화는 말풍선 */
:root{
 --navy:#102f5e;--navy2:#1d4a8a;--gold:#f2c94c;--bg:#f4f1ea;--card:#fff;--ink:#1d2433;--muted:#6b7280;--line:#e3ddd0;
 --ok:#1f9d55;--okbg:#e6f6ec;--bad:#d64545;--badbg:#fdeaea;--a:#ffffff;--b:#dbe8fb;--keybg:#fff3c4;--keyink:#8a6a00;
 --f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--hand:"Gaegu","Noto Sans KR",cursive;
 color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-block:16px 70px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--navy);color:#fff;border-radius:18px;padding:18px 18px 14px;position:relative;overflow:hidden}
header.top:after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(242,201,76,.18)}
.hrow{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.hlogo{width:58px;height:58px;border-radius:14px;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden}.hlogo img{width:52px;height:auto;display:block}
.brand{font-size:11px;letter-spacing:.18em;color:var(--gold);font-weight:900}
h1{margin:4px 0 2px;font-size:clamp(23px,6vw,30px);font-weight:900;letter-spacing:-.02em;text-wrap:balance;word-break:keep-all}
h1 small{display:block;font-size:13px;font-weight:500;color:rgba(255,255,255,.78);letter-spacing:0;margin-top:2px}
.who{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap;position:relative;z-index:1}
.who .me{background:#fff;color:var(--navy);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:900}
.who .tot{background:var(--gold);color:var(--navy);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:900}
.who button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:999px;padding:3px 10px;font-size:12px}

h2.sec{font-size:15px;font-weight:900;color:var(--navy);margin:20px 2px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2.sec span{font-size:12.5px;font-weight:500;color:var(--muted)}
.dlgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,138px),1fr));gap:8px}
.dcard{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 10px 9px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.dcard b{font-size:14.5px;color:var(--navy);line-height:1.3}
.dcard small{font-size:12px;color:var(--muted)}
.dcard[aria-pressed="true"]{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset}
.dots{display:flex;gap:3px;margin-top:2px}
.dots i{width:12px;height:6px;border-radius:3px;background:#e7e2d6}
.dots i.on{background:var(--gold)}
.dcard .done{font-size:11.5px;font-weight:900;color:var(--ok)}

.today{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.today .lab{font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--keyink)}
.today .big{display:flex;align-items:center;gap:12px;margin-top:6px;flex-wrap:wrap}
.mico{width:46px;height:46px;border-radius:12px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-weight:900;font-size:20px;flex:none}
.today h3{margin:0;font-size:20px;color:var(--navy);line-height:1.25}
.today p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.today .go{margin-left:auto}
.mt{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 260px}
.ladder{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:14px}
.step{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 2px;font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;line-height:1.25;min-width:0}
.step b{display:block;font-size:14px;color:var(--navy)}
.step.passed{background:var(--okbg);border-color:#9fd8b5;color:var(--ok)}
.step.passed b{color:var(--ok)}
.step.retry{background:#fff6dc;border-color:#f2c94c;border-style:solid;color:#8a6a00}.step.retry b{color:#b07d00}.step.retry small{display:block;font-size:10.5px;font-weight:800;color:#b07d00;margin-top:1px}.dots i.try{background:#f2c94c;opacity:.55}
.step.next{border-color:var(--navy);background:#fff;color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.step.last{border-style:dashed}
.ladnote{font-size:12px;color:var(--muted);margin:6px 2px 0}

.btn{border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;white-space:nowrap}
.btn.pri{background:var(--navy);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn.lg{padding:10px 20px;font-size:16px}
.btn:disabled{opacity:.4;cursor:default}
.mini{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700;color:var(--navy)}

/* activity */
.act{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.acthead{background:var(--navy);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.acthead b{font-size:16px}.acthead small{display:block;color:rgba(255,255,255,.75);font-size:12.5px;font-weight:500}
.acthead .cnt{background:var(--gold);color:var(--navy);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:900;font-variant-numeric:tabular-nums}
.how{background:#fffaf0;border-bottom:1px dashed #e6d6ad;padding:9px 16px;font-size:13.5px;color:#6b5a2a}
.stage{padding:16px 12px 18px;display:flex;flex-direction:column;gap:12px}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.ln{display:flex;gap:8px;align-items:flex-start;max-width:92%}
.ln.r{align-self:flex-end;flex-direction:row-reverse}
.sp{flex:none;min-width:34px;height:34px;padding:0 6px;border-radius:17px;background:var(--navy);color:#fff;font-size:12.5px;font-weight:900;display:grid;place-items:center}
.ln.r .sp{background:var(--navy2)}
.bub{background:var(--a);border:1px solid var(--line);border-radius:16px;border-top-left-radius:4px;padding:8px 13px;min-width:0;font-size:17px;line-height:1.6;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.ln.r .bub{background:var(--b);border-color:#c6d8f3;border-top-left-radius:16px;border-top-right-radius:4px}
.ko{display:block;font-family:var(--hand);font-size:17px;color:#5b5f6a;line-height:1.35;margin-top:2px}
.bub .say{border:0;background:none;padding:0 0 0 4px;font-size:15px;vertical-align:1px}
.ln.cur .bub{box-shadow:0 0 0 3px var(--gold)}
.ln.dim{opacity:.38}
.k{background:var(--keybg);color:var(--keyink);border-radius:4px;padding:0 2px;font-weight:700}
.cover{display:inline-block;background:repeating-linear-gradient(90deg,#d9d4c7 0 10px,#e8e3d6 10px 20px);border-radius:6px;color:transparent;user-select:none;min-width:12em}

/* inputs */
.bl{display:inline-block;vertical-align:baseline;margin:0 2px;max-width:100%}
.bl input{font:inherit;font-weight:700;border:0;border-bottom:2.5px solid var(--navy2);background:#f6f8fc;border-radius:6px 6px 0 0;padding:0 6px;color:var(--navy);outline:none;text-align:center;max-width:100%;box-sizing:border-box}
.bl.ok input{border-color:var(--ok);color:var(--ok);background:var(--okbg)}
.bl.bad input{border-color:var(--bad);color:var(--bad);background:var(--badbg);animation:shake .3s}
.bl.shown input{border-color:var(--gold);background:#fff7d6}
.bl .note{display:block;font-size:12.5px;font-weight:700;line-height:1.35;color:var(--navy2);background:#e8f0fb;border-radius:0 0 6px 6px;padding:2px 6px;text-align:left;white-space:normal}
.bl.alt input{border-color:var(--navy2);background:#e8f0fb;color:var(--navy2)}
.bl .ans{display:block;font-size:12.5px;font-weight:700;color:var(--keyink);background:var(--keybg);border-radius:0 0 6px 6px;padding:1px 6px}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){.bl.bad input,.chip.bad,.card.bad{animation:none}}
.full{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.full input{width:100%;font:inherit;font-size:16px;border:2px solid var(--line);border-radius:10px;padding:7px 10px;outline:none;background:#fff;color:var(--ink)}
.full input:focus{border-color:var(--navy)}
.full.ok input{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.full.bad input{border-color:var(--bad);background:var(--badbg);animation:shake .3s}
.hint{font-family:"Courier New",monospace;font-size:15px;color:var(--navy2);letter-spacing:.02em;word-break:break-word}
.fb{font-size:13.5px;line-height:1.5}
.fb .x{color:var(--bad);font-weight:700;text-decoration:line-through}
.fb .ansl{display:block;color:var(--keyink);background:var(--keybg);border-radius:8px;padding:4px 8px;margin-top:3px;font-weight:700}
.rowb{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}

/* order / puzzle */
.pool{display:flex;flex-direction:column;gap:8px;border-top:2px dashed var(--line);padding-top:12px}
.pool .lab,.slab{font-size:12.5px;font-weight:900;color:var(--muted)}
.card{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;text-align:left;font-size:15.5px;line-height:1.45;display:flex;gap:8px;align-items:flex-start}
.card .sp{min-width:30px;height:30px;font-size:12px}
.card.bad{border-color:var(--bad);background:var(--badbg);animation:shake .3s}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--navy2);background:#fff;color:var(--navy);border-radius:10px;padding:5px 11px;font-size:16px;font-weight:700}
.chip.used{visibility:hidden}
.chip.bad{border-color:var(--bad);color:var(--bad);animation:shake .3s}
.built{min-height:48px;border:2px dashed #c6d8f3;border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;background:#f7faff}
.built .chip{border-style:solid;background:var(--b)}
.qline{background:var(--bg);border-radius:12px;padding:10px 12px}
.qline .ko{font-size:19px;color:var(--ink)}

/* role */
.roles{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.roles .btn[aria-pressed="true"]{background:var(--navy);color:#fff}

.result{position:fixed;inset:0;background:rgba(16,47,94,.6);display:grid;place-items:center;z-index:20;padding:16px}
.result[hidden]{display:none}
.result .box{background:#fff;border-radius:20px;padding:24px 22px;text-align:center;width:100%;max-width:360px}
.result .big{font-size:44px;line-height:1}
.result h2{margin:6px 0 2px;color:var(--navy)}
.result p{margin:0 0 12px;color:var(--muted);font-size:14px}
.meter{height:10px;border-radius:5px;background:#eee8da;overflow:hidden;margin:4px 0 12px}
.meter i{display:block;height:100%;background:var(--gold)}
.must{margin:0 0 12px;background:var(--badbg);color:var(--bad);border-radius:12px;padding:8px 10px;font-size:13.5px;font-weight:700;line-height:1.5}
.must b{color:var(--navy)}
.col{display:flex;flex-direction:column;gap:8px;align-items:stretch}
a.btn{text-decoration:none;text-align:center}
a.btn[hidden]{display:none}
.sentok{color:var(--ok);font-weight:900;font-size:14px}

.start{position:fixed;inset:0;background:rgba(16,47,94,.75);display:grid;place-items:center;z-index:30;padding:16px}
.start[hidden]{display:none}
.start .box{background:#fff;border-radius:20px;padding:22px 20px;width:100%;max-width:380px}
.start h2{margin:0 0 4px;color:var(--navy);font-size:20px}
.start p{margin:0 0 14px;color:var(--muted);font-size:13px}
.start label{display:block;font-weight:900;color:var(--navy);font-size:14px;margin:6px 0 6px}
.start input{width:100%;font:inherit;font-size:17px;border:2px solid var(--line);border-radius:12px;padding:9px 12px;outline:none}
.start input:focus{border-color:var(--navy)}
.start .btn{width:100%;margin-top:14px}
footer{font-size:12px;color:var(--muted);text-align:center;margin-top:22px}
@media (max-width:520px){.ladder{grid-template-columns:repeat(4,minmax(0,1fr))}.today .go{margin-left:0;width:100%}.bub{font-size:16px}}
</style><style>
/* 부엉이 캐릭터 공통 */
header.hero{padding-right:138px;min-height:168px}
header.hero:after{right:-30px;top:auto;bottom:-40px;width:190px;height:190px;background:radial-gradient(circle,rgba(242,201,76,.38),rgba(242,201,76,0) 70%)}
.hero-owl{position:absolute;right:4px;bottom:-2px;width:132px;height:auto;z-index:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px)}}
.hello{position:relative;z-index:1;display:inline-block;margin-top:10px;background:#fff;color:var(--navy);font-weight:700;font-size:14px;line-height:1.45;border-radius:14px;padding:7px 12px;max-width:100%;word-break:keep-all}
.hello:after{content:"";position:absolute;right:-7px;top:50%;margin-top:-7px;border:7px solid transparent;border-left-color:#fff;border-right:0}
.owlbar{display:flex;align-items:flex-end;gap:10px;padding:12px 14px 0}
.owlbar img{width:70px;height:auto;flex:none;transform-origin:50% 100%}
.owlbar img.hop{animation:hop .5s ease}
.owlbar img.sad{animation:wob .5s ease}
@keyframes hop{30%{transform:translateY(-12px) scale(1.05)}60%{transform:translateY(0)}80%{transform:translateY(-4px)}}
@keyframes wob{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.obub{position:relative;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:700;color:var(--navy);font-size:15px;line-height:1.4;margin-bottom:14px;word-break:keep-all}
.obub:before{content:"";position:absolute;left:-8px;bottom:12px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
.obub:after{content:"";position:absolute;left:-6px;bottom:13px;border:7px solid transparent;border-right-color:var(--bg);border-left:0}
.obub.good{color:var(--ok)}.obub.bad{color:var(--bad)}
.result .owl{width:150px;height:auto;margin:-70px auto 0;display:block;filter:drop-shadow(0 8px 12px rgba(0,0,0,.25))}
.result .box{margin-top:60px}
.stars{font-size:30px;letter-spacing:4px;color:var(--gold);line-height:1;margin:6px 0 2px}
.stars .off{color:#e4dfd2}
.clearpanel{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 4px}
.clearpanel img{width:130px;height:auto}
.clearpanel h3{margin:0;color:var(--navy);font-size:21px}
.clearpanel p{margin:0;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){.hero-owl,.owlbar img.hop,.owlbar img.sad{animation:none}}
@media (max-width:420px){header.hero{padding-right:112px}.hero-owl{width:110px}}
</style>
<style>
/* 머리글 줄이기: 부엉이는 머리글 위에 앉고, 제목은 한 줄 */
header.hero{margin-top:58px;padding-right:18px;min-height:0;overflow:visible}
header.hero:after{display:none}
.hero-owl{top:-56px;bottom:auto;right:10px;width:96px}
header.hero h1.one{white-space:nowrap;font-size:clamp(20px,6.3vw,30px)}
header.hero h1 small{margin-top:4px}
.hello{display:block;width:fit-content;margin-top:10px}
.hello:after{right:44px;top:-7px;margin-top:0;border:7px solid transparent;border-bottom-color:#fff;border-top:0}
h2.sec{flex-wrap:wrap;word-break:keep-all;row-gap:2px}
@media (max-width:420px){header.hero{padding-right:16px}.hero-owl{width:88px;top:-52px}}
</style>
<style>
/* 부엉이를 머리글 안 오른쪽 위 빈칸에 */
header.hero{margin-top:0;padding-right:18px}
header.hero .brand,header.hero h1{padding-right:92px}
.hero-owl{top:10px;bottom:auto;right:12px;width:86px}
header.hero h1.one{font-size:clamp(19px,5.4vw,28px)}
.hello{width:auto}
.hello:after{right:34px}
@media (max-width:420px){header.hero{padding-right:16px}.hero-owl{width:80px;top:10px;right:10px}header.hero .brand,header.hero h1{padding-right:84px}}
</style>
<style>
/* 부엉이를 크게, 말풍선 아래 끝까지 */
header.hero{padding-right:18px}
header.hero .brand,header.hero h1{padding-right:0}
.htop{display:flex;align-items:flex-end;gap:6px;position:relative;z-index:1}
.hl{flex:1;min-width:0}
header.hero .hero-owl{position:static;width:132px;flex:none;margin:0 -8px -2px 0}
header.hero h1.one{white-space:normal;font-size:clamp(22px,6.4vw,30px)}
.hello{display:block;width:auto;margin-top:10px}
.hello:after{right:-7px;top:50%;margin-top:-7px;border:7px solid transparent;border-left-color:#fff;border-right:0}
@media (max-width:420px){header.hero{padding-right:16px}header.hero .hero-owl{width:120px;margin-right:-6px}header.hero .brand,header.hero h1{padding-right:0}}
</style>
<style>
/* 이오: 오른쪽 맨 위 + 문구, 말풍선은 아래 전체 너비 */
.htop{align-items:flex-start}
.hr{flex:none;width:126px;display:flex;flex-direction:column;align-items:center;margin:-4px -8px 0 0;position:relative;z-index:1}
.tag{font-size:12.5px;font-weight:900;color:var(--gold);text-align:center;line-height:1.3;letter-spacing:-.01em;word-break:keep-all;white-space:nowrap}
header.hero .hr .hero-owl{position:static;width:114px;margin:2px 0 0}
.hello{display:block;width:auto;margin-top:8px}
.hello:after{right:52px;left:auto;top:-7px;margin-top:0;border:7px solid transparent;border-bottom-color:#fff;border-top:0}
.eo{display:inline-block;font-size:11px;font-weight:900;background:var(--navy);color:var(--gold);border-radius:6px;padding:0 6px;margin-right:6px;vertical-align:2px}
@media (max-width:420px){.hr{width:116px;margin-right:-6px}header.hero .hr .hero-owl{width:104px}.tag{font-size:12px}}
</style>

<style>@media (max-width:380px){header.hero h1{font-size:20px}}</style>

<style>/* 이오 문구: 말하듯 손글씨, 흰색 */.tag{font-family:var(--hand);font-size:17px;font-weight:700;color:#fff;line-height:1.15;letter-spacing:0;transform:rotate(-4deg);text-shadow:0 2px 0 rgba(0,0,0,.18)}.tag b{color:var(--gold);font-size:19px}@media (max-width:420px){.tag{font-size:16px}.tag b{font-size:18px}}</style>
<style>
.flash{background:var(--bg);border-radius:18px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.flash .w{font-size:clamp(30px,9vw,42px);font-weight:900;color:var(--navy);letter-spacing:-.01em;line-height:1.15;word-break:keep-all}
.flash .ph{font-size:17px;color:var(--muted);font-family:"Times New Roman",serif}
.flash .m{font-size:19px;font-weight:700;color:var(--ink);word-break:keep-all}
.flash .x{font-size:13.5px;color:var(--muted);word-break:keep-all}
.flash .hid{min-width:9em;min-height:1.4em;border-radius:8px;background:repeating-linear-gradient(90deg,#d9d4c7 0 10px,#e8e3d6 10px 20px)}
.bigsay{width:64px;height:64px;border-radius:50%;border:0;background:var(--navy);color:var(--gold);font-size:26px;display:grid;place-items:center}
.q{background:var(--bg);border-radius:16px;padding:18px 14px;text-align:center}
.q .w{font-size:clamp(26px,8vw,36px);font-weight:900;color:var(--navy);word-break:keep-all}
.q .m{font-size:21px;font-weight:700;word-break:keep-all}
.q .lab{font-size:12.5px;font-weight:900;color:var(--muted);margin-bottom:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 8px;font-size:17px;font-weight:700;color:var(--ink);min-height:58px;word-break:keep-all;line-height:1.35}
.opt.good{border-color:var(--ok);background:var(--okbg);color:var(--ok)}

.typebox{display:flex;gap:8px}
.typebox input{flex:1;min-width:0;font:inherit;font-size:20px;font-weight:700;border:2px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;color:var(--navy);text-align:center}
.typebox input:focus{border-color:var(--navy)}
.typebox.ok input{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.typebox.bad input{border-color:var(--bad);background:var(--badbg);animation:shake .3s}
.msg{text-align:center;font-weight:700;font-size:15px;min-height:1.4em}
.msg.good{color:var(--ok)}.msg.bad{color:var(--bad)}
.msg .ansl{display:inline-block;margin-top:4px;color:var(--keyink);background:var(--keybg);border-radius:8px;padding:3px 10px}
.prog{height:8px;border-radius:4px;background:#eee8da;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);transition:width .3s}
.again{font-size:12.5px;color:var(--muted);text-align:center;margin:0}
.letters .chip{min-width:40px;font-size:20px}
.center{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:6px;margin-top:10px}
.wl{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 8px;font-size:14px;min-width:0}
.wl b{color:var(--navy)}.wl span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.wl button{border:0;background:none;padding:0;font-size:15px;flex:none}
details.more{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px}

.sets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.books{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px}
.bookb{flex:none;border:1.5px solid var(--line);background:#fff;color:var(--navy);font-weight:800;font-size:13.5px;border-radius:999px;padding:7px 14px;white-space:nowrap}
.bookb[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--gold)}

.setb .no{font-size:26px;font-weight:900;color:var(--navy);line-height:1.1}
.setb .nm{font-size:13.5px;font-weight:700;color:var(--ink)}
.setb .dots{justify-content:center}
.setb .dots i{width:8px}
.setb .done{font-size:11.5px;font-weight:900;color:var(--ok)}
.setb[aria-pressed="true"]{border-color:var(--navy);background:var(--navy)}
.setb[aria-pressed="true"] .no{color:var(--gold)}.setb[aria-pressed="true"] .nm{color:#fff}
.setb[aria-pressed="true"] .dots i{background:rgba(255,255,255,.25)}.setb[aria-pressed="true"] .dots i.on{background:var(--gold)}
/* 오늘의 모험 */
.course{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 14px 16px;position:relative;overflow:hidden}
.ctop{display:flex;gap:12px;align-items:center}
.ctop img{width:92px;height:auto;flex:none;margin:-4px 0 -6px -4px}
.ctop .lab{font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--keyink)}
.ctop h3{margin:2px 0 0;font-size:20px;color:var(--navy);line-height:1.25;word-break:keep-all}
.ctop p{margin:2px 0 0;font-size:13.5px;color:var(--muted);word-break:keep-all}
.path{display:flex;align-items:flex-start;margin:14px 0 12px;padding:0 2px}
.node{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.node:not(:last-child):after{content:"";position:absolute;top:21px;left:calc(50% + 22px);right:calc(-50% + 22px);border-top:3px dotted #d8cfba}
.node .st{width:44px;height:44px;border-radius:50%;background:var(--bg);border:2px solid var(--line);display:grid;place-items:center;font-weight:900;color:var(--muted);font-size:16px;position:relative;z-index:1}
.node small{font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;line-height:1.25;word-break:keep-all}
.node.boss .st{background:var(--navy);border-color:var(--navy);color:var(--gold)}
.node.done .st{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.node.now .st{border-color:var(--navy);box-shadow:0 0 0 3px rgba(16,47,94,.18);color:var(--navy);background:#fff}
.node.now small{color:var(--navy)}
.pickhint{margin:12px 0 0;font-size:12.5px;color:var(--muted);word-break:keep-all}.pickhint b{color:var(--navy)}
.path.pick{margin-top:8px}
.path.pick .node .st{width:36px;height:36px;font-size:14px}
.path.pick .node:not(:last-child):after{top:17px;left:calc(50% + 18px);right:calc(-50% + 18px)}
.path.pick small{font-size:11px}
.path.pick small em{display:block;font-style:normal;font-size:10px;font-weight:900;color:var(--gold);background:var(--navy);border-radius:5px;padding:0 4px;margin:2px auto 0;width:fit-content}

.node.opt.on small{color:var(--navy)}
.node.req:not(.boss) .st{background:#fff;border-color:var(--navy);color:var(--navy)}
.course .go{width:100%}
.single{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:6px;margin-top:10px}

.mscore{font-size:44px;font-weight:900;line-height:1.1;margin:4px 0}.mscore.ok{color:var(--ok,#1b7a45)}.mscore.no{color:var(--bad,#d33)}.mnote{font-size:15px;margin:6px 0 0}.mnote.ok{color:var(--ok,#1b7a45)}.mnote.no{color:var(--bad,#d33)}
/* 🪙 쿨앱 장학금 동전 (2026-10-29 · 동전 그림: 애나쌤) */
.cc-coin{position:fixed;z-index:99999;width:86px;height:86px;border:0;padding:0;background:none;cursor:pointer;filter:drop-shadow(0 6px 10px rgba(110,70,0,.35));animation:ccIn .45s cubic-bezier(.2,1.6,.4,1) both,ccFloat 1.6s ease-in-out .45s infinite;-webkit-tap-highlight-color:transparent}
.cc-coin img{width:100%;height:100%;display:block;pointer-events:none}
.cc-coin.big{width:100px;height:100px;filter:drop-shadow(0 0 12px rgba(255,214,74,.95)) drop-shadow(0 6px 10px rgba(110,70,0,.35))}
.cc-coin.bye{animation:ccBye .5s ease-in forwards}
.cc-coin.got{animation:ccGot .55s ease-out forwards;pointer-events:none}
@keyframes ccIn{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes ccFloat{50%{transform:translateY(-8px) rotate(6deg)}}
@keyframes ccBye{to{transform:scale(.2);opacity:0}}
@keyframes ccGot{40%{transform:scale(1.35)}to{transform:translateY(-90px) scale(.6);opacity:0}}
.cc-toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:99999;background:#102f5e;color:#fff;border-radius:16px;padding:12px 16px;font-size:15px;font-weight:700;line-height:1.4;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25);width:max-content;max-width:min(340px,calc(100vw - 32px));animation:ccToast .35s ease-out both}@keyframes ccToast{from{transform:translate(-50%,12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.cc-toast em{font-style:normal;color:#ffd54a}
@media (prefers-reduced-motion:reduce){.cc-coin,.cc-coin.got,.cc-coin.bye{animation:none}}

const COIN=(()=>{
  const K='coolapp_coin',kst=t=>new Date(t+9*3600e3).toISOString().slice(0,10),today=()=>kst(Date.now());
  let S0={};try{S0=JSON.parse(localStorage.getItem(K)||'{}')||{}}catch(e){}
  const save=()=>{try{localStorage.setItem(K,JSON.stringify(S0))}catch(e){}};
  const st=()=>{const d=today();if(S0.d!==d)S0={d,shown:0,got:S0.got||[],days:S0.days||[]};return S0};
  const tier=()=>{const since=kst(Date.now()-13*864e5),n=st().days.filter(x=>x>=since).length;return n>=10?2:n>=5?1:0};
  /* 잘 안 함(0~4일) 10~100원 · 보통(5~9일) ~300원 · 꾸준함(10일+) ~500원 */
  const W=[[[10,45],[30,35],[100,20]],[[10,20],[30,25],[100,30],[200,15],[300,10]],[[30,15],[100,30],[200,25],[300,15],[400,10],[500,5]]];
  const pick=()=>{const L=W[tier()];let r=Math.random()*L.reduce((a,x)=>a+x[1],0);for(const[v,w]of L)if((r-=w)<0)return v;return L[0][0]};
  let armed=false,hint='「선생님께 보내기」를 누르면 쌓여요';
  function toast(html,ms){const t=document.createElement('div');t.className='cc-toast';t.innerHTML=html;document.body.appendChild(t);setTimeout(()=>t.remove(),ms||3200)}
  function show(){
    if(document.visibilityState!=='visible')return setTimeout(show,4000);
    const s=st();if(s.shown>=2)return;s.shown++;save();
    const v=pick(),b=document.createElement('button');b.className='cc-coin'+(v>=400?' big':'');b.type='button';b.setAttribute('aria-label',`동전 ${v}원 줍기`);
    b.innerHTML=`<img src="${COIN_IMG[v]}" alt="${v}원">`;
    b.style.left=Math.round(12+Math.random()*(innerWidth-120))+'px';b.style.top=Math.round(innerHeight*(.18+Math.random()*.5))+'px';
    let done=false;
    b.onclick=e=>{e.stopPropagation();if(done)return;done=true;const s=st();s.got.push(v);save();b.classList.add('got');setTimeout(()=>b.remove(),600);
      toast(`${v>=400?'💎 <em>대박! ':'🪙 <em>'}쿨앱 장학금 +${v}원!</em><br><small>${hint}</small>`)};
    document.body.appendChild(b);
    setTimeout(()=>{if(done)return;done=true;b.classList.add('bye');setTimeout(()=>b.remove(),550)},8000);
  }
  return{
    arm(ok,h){if(h)hint=h;if(!ok||armed)return;armed=true;if(st().shown>=2||Math.random()>.6)return;setTimeout(show,(15+Math.random()*75)*1000)},
    markDay(){const s=st();if(!s.days.includes(s.d)){s.days.push(s.d);s.days=s.days.slice(-30);save()}},
    coins:()=>st().got.join(','),clear(){st().got=[];save()},show,toast
  };
})();

  <div class="owlbar"><img id="owlimg" src="" alt=""><div class="obub" id="obub"></div></div><div class="stage" id="stage"></div>`;

 ({card:gCard,meaning:gChoice,listen:gChoice,pick:gChoice,spell:gSpell,dict:gType,write:gType})[mode](s);
 (COURSE?$("#course"):$("#act")).scrollIntoView({behavior:"smooth",block:"start"})}

function gSpell(s){let built=[],pieces=[],tries=0;
 function setup(){const i=ST.q[0],w=s.W[i][0].replace(/\s*~\s*/g," ").trim();const multi=/ /.test(w);
  pieces=shuffle((multi?w.split(" "):w.split("")).map((c,k)=>({c,k})));built=[];tries=0;ST.multi=multi;draw()}
 function draw(){const i=ST.q[0],w=s.W[i];
  $("#stage").innerHTML=bar()+`<div class="q"><div class="lab">이 뜻의 영어를 만들어요</div><div class="m">${esc(w[2])}</div></div>
   <div class="built" id="built">${built.map((p,b)=>`<button class="chip" data-unb="${b}">${esc(p.c)}</button>`).join("")||`<span class="slab" style="align-self:center">여기에 ${ST.multi?"숙어":"단어"}가 만들어져요</span>`}</div>
   <div class="chips letters center">${pieces.map((p,b)=>`<button class="chip${built.includes(p)?" used":""}" data-pz="${b}">${esc(p.c)}</button>`).join("")}</div>
   <div class="msg" id="msg"></div><div class="center"><button class="mini" data-sayw="${i}">🔊 힌트 듣기</button><button class="mini" data-pzreset>다시 놓기</button></div>`}
 ST.pz=(t,b)=>{if(ST.lock)return;if(t==="add"){const p=pieces[b];if(built.includes(p))return;built.push(p)}else if(t==="rm")built.splice(b,1);else built=[];
  if(built.length===pieces.length){const i=ST.q[0],w=s.W[i],got=built.map(p=>p.c).join(ST.multi?" ":"");
   if(same(got,w[0])){draw();$("#msg").className="msg good";$("#msg").textContent=w[0];speak(w[0]);ST.lock=true;if(tries)wrong(i);else right(i);
    setTimeout(()=>{ST.lock=false;if(ST.q.length)setup();else finishSay()},800);return}
   tries++;draw();$("#built").querySelectorAll(".chip").forEach(x=>x.classList.add("bad"));$("#msg").className="msg bad";owl("scholar",tries>=2?"정답을 보고 다시 만들어 봐!":"순서가 달라! 조각을 눌러서 빼 봐.","bad");
   if(tries>=2)$("#msg").innerHTML=`<span class="ansl">정답 · ${esc(w[0])}</span>`;return}
  draw()};
 setup()}

function runStep(){const c=COURSE;if(c.idx<c.steps.length){openAct(c.steps[c.idx]);return}
 if(c.miss.size&&!c.review){c.review=true;openAct("write",{list:[...c.miss],review:true});return}
 endCourse()}
function finishStep(pct){const c=COURSE,s=set(),M=MN(MODE);
 if(ST.review){c.res.push({m:"review",ok:ST.ok,n:ST.total});endCourse();return}
 c.res.push({m:MODE,ok:ST.ok,n:ST.total});c.idx++;renderCourse();renderSets();
 const nx=c.steps[c.idx],last=c.idx>=c.steps.length;
 /* 마스터 테스트: 점수를 보여 주고 90점 이상이면 재시험은 선택, 미만이면 필수 (2026-10-29) */
 if(MODE==="write"&&last){const sc=Math.round(ST.ok/Math.max(1,ST.total)*100),pass=sc>=90,mn=c.miss.size;
  owl(pass?"knight":"scholar",pass?"통과! 대단해!":"괜찮아! 틀린 단어만 다시 하자!",pass?"good":"");
  $("#stage").innerHTML=`<div class="clearpanel"><img src="${pass?OWL.knight:OWL.scholar}" alt=""><h3>⑦ 마스터 테스트 끝!</h3><div class="mscore ${pass?"ok":"no"}">${sc}점</div><p>한 번에 맞힘 ${ST.ok}/${ST.total}</p>
   ${!mn?`<button class="btn pri lg nextb" data-cstep style="margin-top:8px">다음: 🏆 결과 보기 ▶</button>`
   :pass?`<p class="mnote ok">🎉 통과! 틀린 단어 재시험은 <b>선택</b>이에요.</p><button class="btn pri lg nextb" data-cfin style="margin-top:8px;width:100%">다음: 🏆 결과 보기 ▶</button><button class="btn lg" data-cstep style="margin-top:8px;width:100%">↺ 틀린 단어 ${mn}개 다시 보기 (선택)</button>`
   :`<p class="mnote no">90점이 안 됐어요. 틀린 단어 재시험은 <b>꼭</b> 해야 해요!</p><button class="btn pri lg nextb" data-cstep style="margin-top:8px">다음: ↺ 틀린 단어 ${mn}개 재시험 (필수) ▶</button>`}</div>`;
  $("#cnt").textContent=sc+"점";return}
 owl(MODE==="write"?"knight":"wizard",MODE==="write"?"마스터 테스트 통과! 대단해!":"클리어! 다음 게임 가자!","good");
 $("#stage").innerHTML=`<div class="clearpanel"><img src="${MODE==="write"?OWL.knight:OWL.wizard}" alt=""><h3>${M.n} ${M.t} 클리어!</h3><div class="stars">${stars(pct)}</div><p>한 번에 맞힘 ${ST.ok}/${ST.total}</p>
  <button class="btn pri lg nextb" data-cstep style="margin-top:8px">${nx?`다음: ${MN(nx).n} ${MN(nx).t} ▶`:c.miss.size&&!c.review?`다음: ↺ 틀린 단어 ${c.miss.size}개 ▶`:"다음: 🏆 결과 보기 ▶"}</button></div>`;
 $("#cnt").textContent="클리어!";if(last&&!c.miss.size){}}
function endCourse(){const c=COURSE,s=set(),r=rec(s.id);r.courses=(r.courses||0)+1;save();
 const test=c.res.find(x=>x.m==="write")||{ok:0,n:1};const pct=test.ok/test.n;const mastered=isM(r);
 const miss=[...c.miss].map(i=>s.W[i][0]);const sec=Math.round((Date.now()-T0)/1000),tm=`${Math.floor(sec/60)}분 ${sec%60}초`;
 const sumTxt=c.res.filter(x=>x.m!=="review").map(x=>`${MN(x.m).s} ${x.ok}/${x.n}`).join(" · ");
 showResult({owl:mastered?"knight":pct>=PASS?"wizard":"scholar",title:mastered?`${s.t} 마스터!`:`오늘의 모험 완료!`,pct,
  line:`${NAME||"이름 없음"} · 마스터 테스트 ${test.ok}/${test.n} · ${tm}`,sub:sumTxt,miss,
  q:{prac:`${BK.book} · ${UNIT.replace(/\s*단어$/,"")} ${s.t} · 오늘의 모험`,lv:`${pct>=PASS?"클리어":"재도전"} · ${sumTxt}`,score:`${test.ok}/${test.n}`,time:tm}});
 COURSE=null;$("#act").hidden=true;home()}

/* ───── 끝 ───── */
let SENT=false,warned=false;
function finish(){if(ST.fin)return;ST.fin=true;const s=set(),r=rec(s.id);const pct=ST.total?ST.ok/ST.total:1,pass=pct>=PASS;
 if(!ST.review){r.last=MODE;r.runs++;if(pass&&!r.passed.includes(MODE))r.passed.push(MODE);r.tried=r.tried||[];if(!r.tried.includes(MODE))r.tried.push(MODE)}save();
 if(COURSE){finishStep(pct);return}
 const M=MN(MODE),sec=Math.round((Date.now()-ST.t0)/1000),tm=`${Math.floor(sec/60)}분 ${sec%60}초`;const miss=[...ST.missed].map(i=>s.W[i][0]);const mastered=isM(r);
 showResult({owl:mastered?"knight":pass?"wizard":"scholar",title:pass?(mastered?`${s.t} 마스터!`:`${M.n} ${M.t} 클리어!`):"조금만 더!",pct,
  line:`${NAME||"이름 없음"} · 한 번에 맞힘 ${ST.ok}/${ST.total} · ${tm}`,sub:"",miss,
  q:{prac:`${BK.book} · ${UNIT.replace(/\s*단어$/,"")} ${s.t} · ${M.n} ${M.t}`,lv:pass?"클리어":"재도전",score:`${ST.ok}/${ST.total}`,time:tm}});
 $("#act").hidden=true;home()}
function showResult(o){$("#rO").src=OWL[o.owl];$("#rT").textContent=o.title;$("#rS").innerHTML=stars(o.pct);$("#rP").innerHTML=esc(o.line)+`<br><small>공부한 시간 ${trMin()}</small>`+(o.sub?`<br><small>${esc(o.sub)}</small>`:"");
 $("#rM").style.width=Math.round(o.pct*100)+"%";$("#rW").textContent=o.miss.length?`다시 볼 단어: ${o.miss.join(", ")}`:"";
 const ua=navigator.userAgent,dev=/iPad|Tablet|Android(?!.*Mobile)/i.test(ua)?"태블릿":/Mobi|iPhone|Android/i.test(ua)?"폰":"PC";
 const q={name:NAME||"이름 없음",prac:o.q.prac,lv:o.q.lv,score:o.q.score,shown:"0",wrong:o.miss.length?o.miss.join(" / "):"없음",time:o.q.time+" · "+trText(),dev};
 $("#sendT").href=LOG+"?a=log&app=쿨보카&"+Object.entries(q).map(([k,v])=>k+"="+encodeURIComponent(v)).join("&");
 SENT=false;warned=false;$("#sendT").hidden=false;$("#sentOk").hidden=true;$("#must").hidden=false;$("#must").innerHTML="⚠️ 꼭 <b>📮 선생님께 보내기</b>를 눌러야<br>선생님이 오늘 연습한 걸 확인할 수 있어요!";if(isTest()){SENT=true;$("#sendT").hidden=true;$("#must").innerHTML="🧪 테스트 이름(김정호)이라 기록하지 않아요.";}$("#nextRow").hidden=true;$("#rX").textContent="닫기";
 $("#result").hidden=false;T0=0}
$("#sendT").addEventListener("click",()=>{SENT=true;setTimeout(()=>{$("#sendT").hidden=true;$("#sentOk").hidden=false;$("#must").hidden=true;
 const i=SETS.findIndex(s=>s.id===CUR),ns=SETS[i+1];
 $("#nextRow").innerHTML=ns?`<button class="btn" data-set="${ns.id}" data-close>다음 묶음 보기: ${ns.t}</button>`:"";$("#nextRow").hidden=!ns},300)});
$("#rX").onclick=()=>{if(!SENT&&!warned){warned=true;$("#must").innerHTML="✋ 아직 안 보냈어요!<br><b>📮 선생님께 보내기</b>를 먼저 눌러요.";$("#rX").textContent="그래도 닫기";return}$("#result").hidden=true;window.scrollTo({top:0,behavior:"smooth"})};

document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const s=set();
 if(b.dataset.close!==undefined)$("#result").hidden=true;
 if(b.dataset.who!==undefined){openStart();return}
 if(b.dataset.set){if(COURSE&&COURSE.set!==b.dataset.set)COURSE=null;CUR=b.dataset.set;$("#act").hidden=true;home();if(b.dataset.close!==undefined)window.scrollTo({top:0,behavior:"smooth"});return}
 if(b.dataset.course!==undefined){startCourse();return}
 if(b.dataset.cstep!==undefined){runStep();return}
 if(b.dataset.cfin!==undefined){endCourse();return}
 if(b.dataset.start){COURSE=null;T0=Date.now();trReset();openAct(b.dataset.start);renderCourse();return}
 if(b.dataset.sayw!==undefined){speak(s.W[+b.dataset.sayw][0]);return}
 if(b.dataset.slow!==undefined){speak(s.W[+b.dataset.slow][0],true);return}
 if(b.dataset.cnext!==undefined){ST.cnext();return}
 if(b.dataset.cmem!==undefined){ST.cmem(b.dataset.cmem==="1");return}
 if(b.dataset.op!==undefined){ST.op(+b.dataset.op,b);return}
 if(b.dataset.onext!==undefined){ST.onext();return}
 if(b.dataset.pz!==undefined){ST.pz("add",+b.dataset.pz);return}
 if(b.dataset.unb!==undefined){ST.pz("rm",+b.dataset.unb);return}
 if(b.dataset.pzreset!==undefined){ST.pz("reset");return}
 if(b.dataset.tchk!==undefined){ST.tchk();return}
 if(b.dataset.thint!==undefined){ST.hint();return}
 if(b.dataset.tog!==undefined){const sl=selOf(CUR),m=b.dataset.tog,i=sl.indexOf(m);if(i>-1)sl.splice(i,1);else sl.push(m);renderCourse();return}
 if(b.dataset.book!==undefined){const nb=BOOKS.find(x=>x.id===b.dataset.book);if(nb&&nb!==BK){QRBOOK=null;BKPICK=true;useBook(nb);CUR=SETS[0].id;COURSE=null;$("#act").hidden=true;home()}return}
 if(b.id==="peekBtn"){NAME="test";SCODE="";P=load();$("#start").hidden=true;$("#act").hidden=true;home();return}
 if(b.id==="goBtn"){const n=$("#nm").value.trim();if(!n){$("#nm").focus();$("#nm").placeholder="이름을 먼저 써 주세요";return}NAME=n;SCODE=codeOf(n);try{localStorage.setItem("wd_nm",NAME)}catch(e){}P=load();$("#start").hidden=true;$("#act").hidden=true;home();return}
});
document.addEventListener("keydown",e=>{if(e.key!=="Enter"||e.target.tagName!=="INPUT")return;e.preventDefault();
 if(e.target.id==="nm"){$("#goBtn").click();return}
 if(e.target.id==="ti"){const nx=document.querySelector("[data-onext]");if(nx)nx.click();else ST.tchk()}});

/* ───── 학습 시간 기록: 실제 학습 시간(1분 넘게 손 안 대면 제외) + 빠르게 넘긴 횟수 ───── */
const TR={act:0,last:Date.now(),fast:0,n:0,streak:0,lastAns:Date.now(),on:false};
function trReset(){Object.assign(TR,{act:0,fast:0,n:0,streak:0,last:Date.now(),lastAns:Date.now(),on:true})}
setInterval(()=>{if(TR.on&&!document.hidden&&Date.now()-TR.last<60000)TR.act++},1000);
["click","keydown","input","touchstart"].forEach(ev=>document.addEventListener(ev,()=>{TR.last=Date.now()},true));
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("button");if(!b||!TR.on)return;const d=b.dataset;
 const slow=("cnext" in d)||("lnext" in d);const ans=slow||("cmem" in d)||("op" in d)||("lmem" in d)||("ord" in d)||("pz" in d&&false);if(!ans)return;
 const now=Date.now(),gap=now-TR.lastAns;TR.lastAns=now;TR.n++;
 if(gap<(slow?1500:800)){TR.fast++;TR.streak++;if(TR.streak>=3){TR.streak=0;setTimeout(()=>owl("scholar","앗, 너무 빨라! 소리 끝까지 듣고 천천히 해 보자!","bad"),60)}}else TR.streak=0},true);
function trMin(){const m=Math.floor(TR.act/60),s=TR.act%60;return m?`${m}분 ${s}초`:`${s}초`}
function trText(){const r=TR.n?TR.fast/TR.n:0;return `실제 학습 ${trMin()} · ${TR.n>=5&&r>=.4?"⚠️ 빠르게 넘김 의심":"✅ 꼼꼼히"} (빠른 넘김 ${TR.fast}/${TR.n})`}
function openStart(){$("#nm").value=NAME;$("#start").hidden=false;setTimeout(()=>$("#nm").focus(),50)}
$("#heroOwl").src=OWL.wand;
readHash();P=load();pickBook();if(QRSET&&SETS.some(x=>x.id===QRSET))CUR=QRSET;
home();if(!NAME)openStart();
window.addEventListener("hashchange",()=>{if(readHash()){P=load();$("#start").hidden=true}pickBook();if(QRSET&&SETS.some(x=>x.id===QRSET))CUR=QRSET;COURSE=null;$("#act").hidden=true;home()});
</script>
