<!DOCTYPE html>
<html lang="ko">
<head>
<title>엔쿨 사진 인증</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Gowun+Dodum&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* [Claude] 숙제 사진 인증 · 엔쿨 네이비 + 골드 (2026-11-05) */
  :root{--bg:#F3F5F9;--card:#fff;--ink:#1B2433;--muted:#667085;--line:#E1E6EE;--navy:#132E5E;--navy-soft:#E8EDF6;
    --gold:#D9B45A;--gold-soft:#FBF4E2;--red:#E5484D;
    --ko:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;--en:'Nunito','Helvetica Neue',Arial,sans-serif;--serif:'Cinzel',serif}
  *{box-sizing:border-box}[hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ko);-webkit-font-smoothing:antialiased}
  .band{background:var(--navy);color:#fff}
  .band-in{max-width:560px;margin:0 auto;padding:16px;display:flex;align-items:center;gap:12px}
  .eae{font-family:var(--serif);color:var(--gold);font-size:15px;letter-spacing:.12em}
  .kr{font-size:17px}
  .who{margin-left:auto;text-align:right}
  .who span{display:block;font-size:12px;color:#B9C4DA}
  .who strong{display:inline-block;margin-top:3px;font-size:16px;font-weight:400;color:var(--navy);background:var(--gold);border-radius:999px;padding:3px 12px}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 120px;display:flex;flex-direction:column;gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .label{display:inline-block;font-size:12.5px;color:var(--navy);background:var(--navy-soft);border-radius:6px;padding:3px 9px;margin:0 0 8px}
  h1{font-weight:400;font-size:21px;margin:0 0 6px;color:var(--navy);line-height:1.35}
  .sub{margin:0;color:var(--muted);font-size:14.5px;line-height:1.6}
  .sub b{color:var(--navy)}
  .picks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pickb{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed #B9C4DA;border-radius:16px;background:#fff;padding:20px 10px;font-family:var(--ko);font-size:16px;color:var(--navy);cursor:pointer}
  .pickb .ic{font-size:34px;line-height:1}
  .pickb small{font-size:12.5px;color:var(--muted)}
  .pickb input{display:none}
  .thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .th{position:relative;border-radius:12px;overflow:hidden;background:#eef1f6;aspect-ratio:3/4}
  .th img{width:100%;height:100%;object-fit:cover;display:block}
  .th button{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(19,46,94,.85);color:#fff;font-size:15px;cursor:pointer}
  .th .n{position:absolute;left:6px;bottom:6px;background:#fff;color:var(--navy);border-radius:99px;font-family:var(--en);font-weight:800;font-size:12px;padding:1px 8px}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .bar-in{max-width:560px;margin:0 auto;display:flex;gap:10px}
  .btn{flex:1;border-radius:12px;padding:14px;font-family:var(--ko);font-size:17px;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
  .btn.main{background:var(--navy);border-color:var(--navy);color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .done{text-align:center;box-shadow:inset 0 4px 0 var(--gold)}
  .done .ic{font-size:44px}
  .done h2{margin:6px 0;color:var(--navy);font-weight:400;font-size:22px}
  .done p{margin:0;color:var(--muted)}
  .err{background:#FDECEC;color:#9B1C1F;border-radius:12px;padding:12px 14px;font-size:15px}
  .row{display:flex;gap:8px;margin-top:12px}
  .nmin{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:12px;font-family:var(--ko);font-size:17px}
  .tip{font-size:14.5px;line-height:1.6;background:var(--gold-soft);border-color:var(--gold)}
  .tip b{color:var(--navy)}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<script>/* 카톡 안 작은 브라우저면 바깥 브라우저로 (사진 올리기가 막힐 때가 있어서) */(function(){try{if(/KAKAOTALK/i.test(navigator.userAgent)&&!/[?&#]noext/.test(location.href)){location.href="kakaotalk://web/openExternal?url="+encodeURIComponent(location.href)}}catch(e){}})();</script><body>
<header class="band"><div class="band-in">
  <div><div class="eae">E.A.Ǝ</div><div class="kr">엔쿨 사진 인증</div></div>
  <div class="who"><span>오늘의 인증</span><strong id="who">-</strong></div>
</div></header>

<div class="wrap">
  <section class="card" id="nameCard" hidden>
    <p class="label">처음 한 번만</p><h1>이름을 써 주세요</h1>
    <p class="sub">선생님이 누구 사진인지 알 수 있게 <b>한글 이름</b>을 써요.</p>
    <div class="row"><input id="nmIn" class="nmin" placeholder="예: 김예원" autocomplete="off"><button class="btn main" id="nmGo" style="flex:0 0 auto;padding:12px 18px">확인</button></div>
  </section>

  <section class="card">
    <p class="label" id="when">숙제 사진 인증</p>
    <h1 id="hw">숙제 사진을 보내요</h1>
    <p class="sub">다 한 숙제를 <b>또렷하게</b> 찍어서 보내요. 여러 장도 돼요(최대 6장).</p>
  </section>

  <div class="picks" id="picks">
    <label class="pickb"><span class="ic">📷</span>사진 찍기<small>카메라가 열려요</small><input type="file" id="cam" accept="image/*" capture="environment"></label>
    <label class="pickb"><span class="ic">🖼️</span>앨범에서 고르기<small>여러 장 고를 수 있어요</small><input type="file" id="gal" accept="image/*" multiple></label>
  </div>

  <div class="thumbs" id="thumbs"></div>
  <p class="err" id="err" hidden></p>

  <section class="card done" id="doneCard" hidden>
    <div class="ic">✅</div><h2>선생님께 보냈어요!</h2><p id="doneP">수고했어요. 다음 수업 때 확인할게요.</p>
  </section>

  <section class="card tip">💡 <b>잘 찍는 법</b> — 밝은 곳에서, 종이가 화면에 꽉 차게, 글씨가 흔들리지 않게 찍어요.</section>
</div>

<div class="bar"><div class="bar-in">
  <button class="btn main" id="send" disabled>사진을 골라 주세요</button>
</div></div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const LOG = 'https://script.google.com/macros/s/AKfycbwdK8492SzMcrc_hmwGWIquliehqASMrSAhbXJ5D-UyygkmwYvO23LWDzU8O44UrGQD/exec';
  const Q = new URLSearchParams(location.search);
  let STUDENT = (Q.get('s') || '').replace(/\s+/g, '');
  const CLS = Q.get('c') || '', HW = (Q.get('h') || '').trim(), DATE = Q.get('d') || '';
  const MAX = 6, EDGE = 1600;
  let PH = [];   // {blob, url}
  let sent = false;

  function showErr(m){ $('err').textContent = m; $('err').hidden = false; }
  function hideErr(){ $('err').hidden = true; }
  $('who').textContent = STUDENT || '이름 없음';
  if (HW) $('hw').textContent = HW;
  if (DATE){ const m = DATE.match(/^(\d{4})-(\d{2})-(\d{2})$/); if (m) $('when').textContent = `${+m[2]}/${+m[3]} 숙제 · 사진 인증`; }

  /* 반 숙제장(이름 없는 QR)이면 이름부터 */
  if (!STUDENT){
    $('nameCard').hidden = false;
    try{ $('nmIn').value = localStorage.getItem('enc_rec_name') || ''; }catch(e){}
    $('nmGo').onclick = () => { const v = $('nmIn').value.replace(/\s+/g, ''); if (!v) return; STUDENT = v; try{ localStorage.setItem('enc_rec_name', v); }catch(e){} $('who').textContent = v; $('nameCard').hidden = true; upd(); };
  }

  /* 사진을 가로세로 1600px 안으로 줄여 JPEG로 (빨리 보내지게) */
  async function shrink(file){
    let src;
    try{ src = await createImageBitmap(file, {imageOrientation:'from-image'}); }
    catch(e){ src = await new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = URL.createObjectURL(file); }); }
    const w = src.width || src.naturalWidth, h = src.height || src.naturalHeight, sc = Math.min(1, EDGE / Math.max(w, h));
    const cv = document.createElement('canvas'); cv.width = Math.round(w * sc); cv.height = Math.round(h * sc);
    const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(src, 0, 0, cv.width, cv.height);
    return await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.82));
  }
  async function add(files){
    hideErr();
    for (const f of [...files]){
      if (PH.length >= MAX){ showErr(`사진은 ${MAX}장까지 보낼 수 있어요.`); break; }
      if (!/^image\//.test(f.type || 'image/')) continue;
      try{ const b = await shrink(f); if (b) PH.push({blob:b, url:URL.createObjectURL(b)}); }
      catch(e){ showErr('이 사진은 열 수 없어요. 다른 사진으로 해 주세요.'); }
    }
    draw();
  }
  function draw(){
    $('thumbs').innerHTML = PH.map((p, i) => `<div class="th"><img src="${p.url}" alt="${i + 1}번 사진"><span class="n">${i + 1}</span><button data-i="${i}" aria-label="${i + 1}번 사진 빼기">✕</button></div>`).join('');
    upd();
  }
  function upd(){
    const b = $('send');
    if (sent){ b.disabled = false; b.textContent = '사진 더 보내기'; return; }
    b.disabled = !PH.length; b.textContent = PH.length ? `선생님께 보내기 (${PH.length}장)` : '사진을 골라 주세요';
  }
  $('thumbs').onclick = e => { const x = e.target.closest('button[data-i]'); if (!x) return; const i = +x.dataset.i; URL.revokeObjectURL(PH[i].url); PH.splice(i, 1); draw(); };
  $('cam').onchange = e => { add(e.target.files); e.target.value = ''; };
  $('gal').onchange = e => { add(e.target.files); e.target.value = ''; };

  const b64 = blob => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(blob); });
  $('send').onclick = async () => {
    if (sent){ sent = false; $('doneCard').hidden = true; $('picks').hidden = false; upd(); window.scrollTo({top:0, behavior:'smooth'}); return; }
    if (!PH.length) return;
    if (!STUDENT){ showErr('맨 위에 이름을 먼저 써 주세요.'); window.scrollTo({top:0}); return; }
    const btn = $('send'); btn.disabled = true; btn.textContent = '보내는 중…'; hideErr();
    try{
      const images = [];
      for (const p of PH) images.push({base64: await b64(p.blob), mimeType: 'image/jpeg'});
      const payload = {a:'photo', student:STUDENT, cls:CLS, hw:HW, date:DATE, images};
      const r = await fetch(LOG, {method:'POST', body:JSON.stringify(payload)});
      const j = await r.json();
      if (!j || !j.ok) throw new Error((j && j.error) || '저장 실패');
      const n = PH.length;
      PH.forEach(p => URL.revokeObjectURL(p.url)); PH = []; draw();
      sent = true; $('doneP').textContent = `${n}장을 보냈어요. 수고했어요! 다음 수업 때 선생님이 확인할게요.`;
      $('doneCard').hidden = false; $('picks').hidden = true; upd();
      $('doneCard').scrollIntoView({block:'center', behavior:'smooth'});
    }catch(e){
      btn.disabled = false; upd(); showErr('보내기가 안 됐어요. 다시 눌러 주세요. (' + e.message + ')');
    }
  };
})();
</script>
</body>
</html>
