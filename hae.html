<!DOCTYPE html>
<html lang="ko">
<head>
<title>엔쿨 쿨해석</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Gowun+Dodum&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* [Claude] 쿨해석 · 영어 문장 → 한글 해석 쓰고 바로 채점 (2026-11-04) */
  :root{--bg:#F3F5F9;--card:#fff;--ink:#1B2433;--muted:#667085;--line:#E1E6EE;--navy:#132E5E;--navy-soft:#E8EDF6;
    --gold:#D9B45A;--gold-soft:#FBF4E2;--red:#E5484D;--blue:#1C64F2;--ok:#1B7A45;--ok-soft:#E3F6EA;--mid:#C27C0E;--mid-soft:#FFF3D6;--bad:#D62828;--bad-soft:#FDE4E4;
    --ko:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;--en:'Nunito','Helvetica Neue',Arial,sans-serif;--serif:'Cinzel',serif}
  *{box-sizing:border-box}[hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ko);-webkit-font-smoothing:antialiased}
  .band{background:var(--navy);color:#fff;position:sticky;top:0;z-index:5}
  .band-in{max-width:560px;margin:0 auto;padding:14px 16px 12px}
  .row{display:flex;align-items:center;gap:10px}
  .eae{font-family:var(--serif);color:var(--gold);font-size:14px;letter-spacing:.12em}
  .who{margin-left:auto;font-size:15px;color:var(--navy);background:var(--gold);border-radius:999px;padding:3px 12px}
  .tt{font-family:var(--en);font-weight:800;font-size:20px;margin:6px 0 0}
  .st{font-size:12.5px;color:#B9C4DA;margin-top:2px}
  .prog{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:#DCE3F0}
  .bar{flex:1;height:6px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px;transition:width .2s}
  .wrap{max-width:560px;margin:0 auto;padding:14px 16px 12px;display:flex;flex-direction:column;gap:12px}
  .tip{font-size:13.5px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;line-height:1.55}
  .tip b{color:var(--blue)}
  .cd{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:9px}
  .cd.done{border-color:#C9D6EA}
  .n{width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-family:var(--en);font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
  .en{font-family:var(--en);font-weight:700;font-size:17px;line-height:1.5}.en b{color:var(--blue)}
  textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 11px;font:inherit;font-size:16px;line-height:1.5;min-height:52px;resize:vertical;background:#FBFCFE;color:var(--ink)}
  textarea:focus{outline:none;border-color:var(--navy);background:#fff}
  .foot{padding:4px 16px calc(28px + env(safe-area-inset-bottom))}   /* 제출 버튼은 맨 아래 고정 · 따라다니지 않게 (2026-11-04) */
  .foot-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
  .warn{font-size:13.5px;color:var(--bad);text-align:center}
  .btn{width:100%;border:0;border-radius:14px;padding:15px;font-family:var(--ko);font-size:17px;font-weight:700;cursor:pointer;background:var(--red);color:#fff}
  .btn.navy{background:var(--navy)}.btn:disabled{opacity:.55;cursor:default}
  .err{background:#FFF1F1;border:1px solid #F5B5B7;color:#B42318;border-radius:12px;padding:10px 12px;font-size:14px}
  .sc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 16px;text-align:center}
  .big{font-family:var(--en);font-size:48px;font-weight:800;color:var(--navy);line-height:1}.big small{font-family:var(--ko);font-size:18px;margin-left:2px}
  .cnt{display:flex;justify-content:center;gap:16px;margin-top:10px;font-size:15px;font-weight:700}.cnt .o{color:var(--ok)}.cnt .t{color:var(--mid)}.cnt .x{color:var(--bad)}
  .wd{margin-top:10px;font-size:14px;color:#3A4A5C}.wd b{color:var(--ok)}.wd s{color:var(--bad);text-decoration:none;font-weight:700}
  .cm{margin-top:10px;font-size:14.5px;color:var(--navy);background:var(--navy-soft);border-radius:10px;padding:8px 11px;line-height:1.5}
  .rr{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px}
  .mk{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px}
  .mk.o{background:var(--ok-soft);color:var(--ok)}.mk.t{background:var(--mid-soft);color:var(--mid)}.mk.x{background:var(--bad-soft);color:var(--bad)}
  .rr .e2{font-family:var(--en);font-weight:600;font-size:14px;color:var(--muted);line-height:1.45}.rr .e2 b{color:var(--blue)}
  .rr .k2{font-size:16px;margin-top:4px;line-height:1.5}
  .rr .fb{font-size:13.5px;color:#B45309;margin-top:4px}
  .rr .rf{font-size:13.5px;color:var(--ok);margin-top:4px}
  .wait{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 10px;text-align:center;color:var(--navy);font-size:16px}
  .spin{width:40px;height:40px;border-radius:50%;border:4px solid var(--navy-soft);border-top-color:var(--navy);animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
  .tw{cursor:pointer;border-radius:4px;-webkit-tap-highlight-color:transparent}.tw.on{background:var(--navy-soft);box-shadow:0 0 0 2px var(--navy-soft)}
  .wtip{position:absolute;z-index:20;background:var(--navy);color:#fff;font-family:var(--ko);font-size:14.5px;line-height:1.45;border-radius:10px;padding:7px 11px;box-shadow:0 6px 18px rgba(19,46,94,.25)}.wtip b{font-family:var(--en);color:var(--gold);margin-right:4px}
  .nmin{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:17px;margin:10px 0}
</style>
</head>
<body>
<header class="band"><div class="band-in">
  <div class="row"><span class="eae">ENCOOL</span><span style="font-size:15px">쿨해석</span><span class="who" id="who">이름 없음</span></div>
  <div class="tt" id="tt">불러오는 중…</div><div class="st" id="st"></div>
  <div class="prog" id="prog"><span id="pn">0 / 0 문장</span><div class="bar"><i id="pb"></i></div></div>
</div></header>
<main class="wrap" id="main"></main>
<div class="foot" id="foot" hidden><div class="foot-in"><div class="warn" id="warn" hidden></div><button class="btn" id="go">다 썼어요 · 제출하기</button></div></div>
<script>
(function(){
  const LOG = 'https://script.google.com/macros/s/AKfycbwdK8492SzMcrc_hmwGWIquliehqASMrSAhbXJ5D-UyygkmwYvO23LWDzU8O44UrGQD/exec';
  const Q = new URLSearchParams(location.search), K = (Q.get('k') || '').replace(/[^A-Za-z0-9_\-]/g, ''), CLS = Q.get('c') || '';
  let NAME = (Q.get('s') || '').trim();
  const $ = id => document.getElementById(id), main = $('main');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const bold = s => esc(s).replace(/\*(.+?)\*/g, '<b>$1</b>'), plain = s => String(s).replace(/\*/g, '');
  /* 단어 누르면 뜻 (파란 단어는 빼고 · 2026-11-04) */
  const tapW = s => String(s).split(/(\*.+?\*)/).map(part => /^\*.+\*$/.test(part) ? '<b>' + esc(part.slice(1, -1)) + '</b>' :
    esc(part).replace(/[A-Za-z]+(?:'[a-z]+)?/g, w => { const k = w.toLowerCase(); return P && P.g && P.g[k] && !(P.nog || []).includes(k) ? '<span class="tw" data-w="' + k + '">' + w + '</span>' : w; })).join('');
  let P = null, ANS = [], RES = null, ONLY = null, LOOK = new Set();   // LOOK: 뜻 본 단어   // ONLY: 다시 쓰기 할 문장 번호들
  const dk = () => 'enc_hae_' + K + '_' + NAME;
  const saveDraft = () => { try{ localStorage.setItem(dk(), JSON.stringify(ANS)); }catch(e){} };
  const loadDraft = () => { try{ const a = JSON.parse(localStorage.getItem(dk()) || 'null'); if (Array.isArray(a)) a.forEach((v, i) => { if (i < ANS.length && typeof v === 'string') ANS[i] = v; }); }catch(e){} };
  function who(){ $('who').textContent = NAME || '이름 없음'; }
  function prog(){
    const L = ONLY || P.s.map((_, i) => i), n = L.filter(i => ANS[i].trim()).length;
    $('pn').textContent = n + ' / ' + L.length + ' 문장'; $('pb').style.width = (L.length ? n / L.length * 100 : 0) + '%';
  }
  function askName(){
    main.innerHTML = '<section class="cd"><b style="color:var(--navy);font-size:18px">이름을 써 주세요</b><span style="color:var(--muted);font-size:14px">선생님이 누구 숙제인지 알 수 있게 <b>한글 이름</b>을 써요.</span><input class="nmin" id="nmIn" placeholder="예: 김예원" autocomplete="off"><button class="btn navy" id="nmGo">확인</button></section>';
    let saved = ''; try{ saved = localStorage.getItem('enc_rec_name') || ''; }catch(e){}
    $('nmIn').value = saved; $('foot').hidden = true;
    $('nmGo').onclick = () => { const v = $('nmIn').value.replace(/\s+/g, ''); if (!v) return; NAME = v; try{ localStorage.setItem('enc_rec_name', v); }catch(e){} who(); loadDraft(); write(); };
  }
  function write(){
    RES = null; $('prog').hidden = false; $('foot').hidden = false; $('warn').hidden = true; $('go').disabled = false;
    $('go').className = 'btn'; $('go').textContent = ONLY ? '고친 문장 다시 제출하기' : '다 썼어요 · 제출하기';
    const L = ONLY || P.s.map((_, i) => i);
    main.innerHTML = '<div class="tip">' + (ONLY ? '✕ △ 문장만 다시 써요. 맞은 문장은 그대로 같이 제출돼요.' : '영어 문장을 읽고 아래 칸에 <b style="color:var(--ink)">한글 해석</b>을 써요. <b>파란 단어</b>는 Word Up에서 배운 단어예요. 모르는 단어는 <b style="color:var(--ink)">눌러서</b> 뜻을 봐요.') + '</div>' +
      L.map(i => '<section class="cd' + (ANS[i].trim() ? ' done' : '') + '"><span class="n">' + (i + 1) + '</span><div class="en">' + tapW(P.s[i].en) + '</div><textarea data-i="' + i + '" rows="2" placeholder="한글 해석을 써요">' + esc(ANS[i]) + '</textarea></section>').join('');
    prog(); window.scrollTo({top:0});
  }
  /* 말풍선 */
  const tip = document.createElement('div'); tip.className = 'wtip'; tip.hidden = true; document.body.appendChild(tip);
  const hideTip = () => { tip.hidden = true; document.querySelectorAll('.tw.on').forEach(x => x.classList.remove('on')); };
  document.addEventListener('click', e => {
    const t = e.target.closest && e.target.closest('.tw');
    if (!t){ if (!e.target.closest || !e.target.closest('.wtip')) hideTip(); return; }
    const was = t.classList.contains('on'); hideTip(); if (was) return;
    t.classList.add('on'); LOOK.add(t.dataset.w); tip.innerHTML = '<b>' + esc(t.textContent) + '</b> ' + esc(P.g[t.dataset.w] || ''); tip.hidden = false;
    const r = t.getBoundingClientRect(), tw = Math.min(280, window.innerWidth - 24); tip.style.maxWidth = tw + 'px';
    const w = tip.offsetWidth, h = tip.offsetHeight; let x = r.left + r.width / 2 - w / 2; x = Math.max(12, Math.min(x, window.innerWidth - w - 12));
    let y = r.top - h - 8; if (y < 120) y = r.bottom + 8;
    tip.style.left = x + 'px'; tip.style.top = (y + window.scrollY) + 'px';
  });
  window.addEventListener('scroll', hideTip, {passive:true});
  main.addEventListener('input', e => { const t = e.target; if (t.dataset.i == null) return; ANS[+t.dataset.i] = t.value; t.closest('.cd').classList.toggle('done', !!t.value.trim()); saveDraft(); prog(); $('warn').hidden = true; $('go').dataset.force = ''; });
  $('go').onclick = () => {
    if (!NAME){ askName(); return; }
    const L = ONLY || P.s.map((_, i) => i), empty = L.filter(i => !ANS[i].trim()).length;
    if (empty && $('go').dataset.force !== '1'){ $('warn').textContent = '아직 안 쓴 문장이 ' + empty + '개 있어요. 그래도 제출하려면 한 번 더 눌러요.'; $('warn').hidden = false; $('go').dataset.force = '1'; return; }
    $('go').dataset.force = ''; send();
  };
  function send(){
    $('go').disabled = true; $('foot').hidden = true; $('prog').hidden = true;
    main.innerHTML = '<div class="wait"><div class="spin"></div><b>채점하고 있어요…</b><span style="color:var(--muted);font-size:14px">10초쯤 걸려요. 화면을 닫지 말고 기다려요.</span></div>';
    const payload = { a:'kh', k:K, title:P.book + ' · ' + P.unit + ' · ' + P.title, student:NAME, cls:CLS,
      items:P.s.map((x, i) => ({ en:plain(x.en), ref:x.ref, ko:ANS[i] })), words:P.w || {}, looked:[...LOOK] };
    fetch(LOG, {method:'POST', body:JSON.stringify(payload)}).then(r => r.json()).then(j => {
      if (!j || !j.ok) throw new Error(j && j.error || '채점이 안 됐어요');
      RES = j; result();
    }).catch(e => {
      ONLY = ONLY; write();
      const er = document.createElement('div'); er.className = 'err'; er.textContent = '제출이 안 됐어요. 쓴 해석은 그대로 있으니 다시 눌러 주세요. (' + e.message + ')';
      main.prepend(er);
    });
  }
  function result(){
    const j = RES, n = P.s.length, wt = j.wordTotal || Object.keys(P.w || {}).length, ww = j.wrongWords || [];
    $('prog').hidden = true; $('tt').textContent = P.title;
    const ic = {o:'○', t:'△', x:'✕'};
    main.innerHTML = '<section class="sc"><div class="big">' + j.score + '<small>점</small></div><div class="cnt"><span class="o">○ ' + j.o + '</span><span class="t">△ ' + j.t + '</span><span class="x">✕ ' + j.x + '</span></div>' +
      (wt ? '<div class="wd">배운 단어 뜻 <b>' + (wt - ww.length) + ' / ' + wt + '</b> 맞음' + (ww.length ? ' · 틀린 단어 ' + ww.map(w => '<s>' + esc(w) + '</s>').join(', ') : '') + '</div>' : '') +
      (j.comment ? '<div class="cm">' + esc(j.comment) + '</div>' : '') + (j.saveErr ? '<div class="err" style="margin-top:10px">점수는 나왔지만 선생님께 저장이 안 됐어요. 이 화면을 캡처해서 보내 주세요.</div>' : '') + '</section>' +
      P.s.map((x, i) => { const m = (j.marks[i] || {}).m || 'x', fb = (j.marks[i] || {}).fb || '';
        return '<div class="rr"><span class="mk ' + m + '">' + ic[m] + '</span><div style="min-width:0"><div class="e2">' + bold(x.en) + '</div><div class="k2">' + (esc(ANS[i]) || '<span style="color:var(--muted)">(안 씀)</span>') + '</div>' +
          (m !== 'o' && fb ? '<div class="fb">' + esc(fb) + '</div>' : '') + (m !== 'o' ? '<div class="rf">모범 해석: ' + esc(x.ref) + '</div>' : '') + '</div></div>'; }).join('');
    const bad = P.s.map((_, i) => i).filter(i => (j.marks[i] || {}).m !== 'o');
    $('foot').hidden = false; $('warn').hidden = true; $('go').disabled = false; $('go').className = 'btn navy';
    if (bad.length){ $('go').textContent = '✕ △ 문장만 다시 써 보기'; $('go').onclick = () => { ONLY = bad; write(); $('go').onclick = goSubmit; }; }
    else { $('go').textContent = '🎉 다 맞았어요! 선생님께 보냈어요'; $('go').disabled = true; }
    window.scrollTo({top:0});
  }
  const goSubmit = $('go').onclick;
  fetch('hae/' + K + '.json', {cache:'no-cache'}).then(r => { if (!r.ok) throw 0; return r.json(); }).then(d => {
    P = d; ANS = P.s.map(() => '');
    $('tt').textContent = P.title; $('st').textContent = P.book + ' · ' + P.unit; document.title = '쿨해석 · ' + P.title;
    who(); if (!NAME) askName(); else { loadDraft(); write(); }
  }).catch(() => { $('tt').textContent = '글을 찾지 못했어요'; main.innerHTML = '<div class="err">QR이 잘못됐거나 아직 글이 준비되지 않았어요. 선생님께 알려 주세요.</div>'; });
})();
</script>
</body>
</html>
