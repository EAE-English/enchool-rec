<!DOCTYPE html>
<html lang="ko">
<head>
<title>엔쿨 온라인 숙제장</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="hwicon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="hwicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="hwicon-512.png">
<meta name="apple-mobile-web-app-title" content="엔쿨 숙제장">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Gowun+Dodum&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* [Claude] 온라인 숙제장 · 엔쿨 네이비 + 골드 (2026-11-06) — 종이 숙제장을 안 가져간 아이도 휴대폰으로 보고 체크 */
  :root{--bg:#F3F5F9;--card:#fff;--ink:#1B2433;--muted:#667085;--line:#E1E6EE;--navy:#132E5E;--navy-soft:#E8EDF6;
    --gold:#D9B45A;--gold-soft:#FBF4E2;--green:#1B7A45;
    --ko:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;--en:'Nunito','Helvetica Neue',Arial,sans-serif;--serif:'Cinzel',serif}
  *{box-sizing:border-box}[hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ko);-webkit-font-smoothing:antialiased}
  .band{background:var(--navy);color:#fff}
  .band-in{max-width:560px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:12px}
  .band img{width:44px;height:auto;display:block}
  .eae{font-family:var(--serif);color:var(--gold);font-size:13px;letter-spacing:.12em}
  .kr{font-size:17px}
  .who{margin-left:auto;text-align:right}
  .who span{display:block;font-size:12px;color:#B9C4DA}
  .who strong{display:inline-block;margin-top:3px;font-size:16px;font-weight:400;color:var(--navy);background:var(--gold);border-radius:999px;padding:3px 12px}
  .wrap{max-width:560px;margin:0 auto;padding:14px 16px 40px;display:flex;flex-direction:column;gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  .top h1{font-weight:400;font-size:21px;margin:0;color:var(--navy);line-height:1.35}
  .top .due{margin:4px 0 0;color:var(--muted);font-size:14.5px}
  .top .due b{color:var(--navy);font-weight:400}
  .prog{margin-top:14px;display:flex;align-items:center;gap:10px}
  .bar{flex:1;height:10px;border-radius:99px;background:var(--navy-soft);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px;transition:width .25s}
  .cnt{font-family:var(--en);font-weight:800;color:var(--navy);font-size:15px;white-space:nowrap}
  .cnt small{font-family:var(--ko);font-weight:400;color:var(--muted);font-size:13px}
  .list{display:flex;flex-direction:column;gap:10px}
  .it{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 14px 12px;display:flex;gap:12px;transition:background .2s,border-color .2s}
  .it.on{background:#F7F9FC;border-color:#D5DCE8}
  .ck{flex:none;width:34px;height:34px;border-radius:10px;border:2px solid #B9C4DA;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;margin-top:1px;-webkit-tap-highlight-color:transparent}
  .ck svg{width:20px;height:20px;opacity:0}
  .it.on .ck{background:var(--navy);border-color:var(--navy)}
  .it.on .ck svg{opacity:1}
  .bd{flex:1;min-width:0}
  .hd{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .num{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--navy);color:#fff;font-family:var(--en);font-weight:800;font-size:12.5px}
  .tag{font-size:12.5px;color:var(--navy);background:var(--navy-soft);border-radius:6px;padding:2px 8px}
  .tk{margin:6px 0 0;font-size:17px;line-height:1.4;word-break:keep-all;overflow-wrap:anywhere}
  .dt{margin:3px 0 0;color:var(--muted);font-size:14.5px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
  .it.on .tk,.it.on .dt{color:#98A2B3}
  .go{display:flex;flex-direction:column;gap:6px;margin-top:10px}
  .gob{display:flex;align-items:center;gap:10px;text-decoration:none;border-radius:12px;padding:11px 12px;border:1.5px solid var(--kc,var(--navy));color:var(--kc,var(--navy));background:#fff}
  .gob b{font-weight:400;font-size:16px;white-space:nowrap}
  .gob small{margin-left:auto;font-size:12px;color:var(--muted);text-align:right;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .gob:active{background:var(--navy-soft)}
  .k-voca{--kc:#132E5E}.k-rec{--kc:#B42318}.k-talk,.k-bon{--kc:#1B7A45}.k-photo{--kc:#8A5A00}.k-hae{--kc:#0E6E8C}.k-gyt{--kc:#6B3FA0}.k-aud{--kc:#B42318}
  .done{text-align:center;box-shadow:inset 0 4px 0 var(--gold);background:var(--gold-soft);border-color:var(--gold)}
  .done .ic{font-size:40px;line-height:1}
  .done h2{margin:6px 0 2px;color:var(--navy);font-weight:400;font-size:21px}
  .done p{margin:0;color:var(--muted);font-size:14.5px}
  .foot{color:var(--muted);font-size:13px;text-align:center;line-height:1.6}
  .err{background:#FDECEC;color:#9B1C1F;border-radius:12px;padding:14px;font-size:15px;line-height:1.6}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  /* 아이 전용 주소 (2026-11-12): 이번/지난 숙제 버튼 · 홈 화면에 추가 안내 */
  .tabs{display:flex;gap:8px}
  .tab{flex:1;border:1.5px solid var(--line);background:#fff;color:var(--muted);border-radius:12px;padding:9px 6px;font:inherit;font-size:14.5px;cursor:pointer}
  .tab.on{border-color:var(--navy);background:var(--navy);color:#fff}
  .a2hs{background:var(--gold-soft);border:1.5px solid var(--gold);border-radius:14px;padding:12px 40px 12px 14px;position:relative;font-size:14.5px;line-height:1.6;color:var(--ink)}
  .a2hs b{color:var(--navy);font-weight:400;font-size:15.5px}
  .a2hs small{display:block;color:var(--muted);font-size:13px}
  .a2hs button{position:absolute;right:8px;top:8px;border:0;background:none;font-size:17px;color:var(--muted);cursor:pointer;padding:4px 6px}
  .a2st{margin-top:8px;display:flex;flex-direction:column;gap:6px}.a2st b{font-size:15px!important;color:var(--ink)!important}.a2st img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
  .a2ex{display:inline-block;align-self:flex-start;font-size:12px;color:var(--navy);background:#fff;border:1px solid var(--gold);border-radius:99px;padding:1px 9px;margin-bottom:2px}
  .a2st,.a2dv{margin-right:-26px}
  .a2dv{margin-top:12px;padding-top:10px;border-top:1px dashed var(--gold);display:flex;flex-direction:column;gap:6px}
  .a2r{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13.5px;line-height:1.5}
  .a2r b{display:block;font-weight:400;color:var(--navy);font-size:14px!important}.a2r i{font-style:normal;color:#B42318}
  .a2r span{color:var(--muted)}.a2r.on{border:2px solid var(--navy)}
  .a2hs a.a2go{display:block;margin-top:10px;text-align:center;text-decoration:none;background:var(--navy);color:#fff;border-radius:12px;padding:11px 12px;font-size:16px}
</style>
</head>
<body>
<header class="band"><div class="band-in">
  <img src="logo.png" alt="">
  <div><div class="eae">E.A.Ǝ</div><div class="kr">엔쿨 온라인 숙제장</div></div>
  <div class="who"><span id="cls">오늘의 숙제</span><strong id="who">-</strong></div>
</div></header>
<main class="wrap" id="app"></main>
<script>
(function(){
  const $=s=>document.querySelector(s),W=["일","월","화","수","목","금","토"];
  const LOG="https://script.google.com/macros/s/AKfycbwdK8492SzMcrc_hmwGWIquliehqASMrSAhbXJ5D-UyygkmwYvO23LWDzU8O44UrGQD/exec";
  const SEND_ON=true;/* HwCheck.gs 배포 확인 (2026-11-06 17:48) */
  const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const md=d=>{const x=new Date(d+"T00:00:00");return isNaN(x)?d:`${x.getMonth()+1}월 ${x.getDate()}일 (${W[x.getDay()]})`};
  const mds=d=>{const x=new Date(d+"T00:00:00");return isNaN(x)?d:`${x.getMonth()+1}/${x.getDate()}(${W[x.getDay()]})`};
  /* 아이 전용 주소 (2026-11-12 선생님 「정해진 곳에서 아이들이 자기 숙제를 볼 수 있도록」): hw.html?c=코드 → 학습관리실이 자동으로 적어 두는 구글 시트 「[Claude] 온라인 숙제장」에서 그 아이 숙제 몇 장을 읽어 와요 */
  const HWK_SS="1_ZoeGSdCxmZQpk5sasi1au10X9auhuBvo_lB_Hk8NcI";
  const KC=(new URLSearchParams(location.search).get("c")||"").toLowerCase();
  function gvizUrl(code,tqx){return "https://docs.google.com/spreadsheets/d/"+HWK_SS+"/gviz/tq?tqx="+tqx+"&headers=1&sheet=hw&tq="+encodeURIComponent("select D where A='"+code+"'")+"&_="+Date.now()}
  function gvizCell(o){if(!o||o.status==="error")throw new Error("gviz");const r=((o.table||{}).rows||[])[0];const v=r&&r.c&&r.c[0]&&r.c[0].v;if(!v)throw new Error("no row");return JSON.parse(v)}
  function gvizJsonp(code){return new Promise((ok,no)=>{const cb="__hwk"+Math.random().toString(36).slice(2);const sc=document.createElement("script");const tm=setTimeout(()=>{fin();no(new Error("timeout"))},9000);
    const fin=()=>{clearTimeout(tm);try{delete window[cb]}catch(e){window[cb]=undefined}sc.remove()};
    window[cb]=o=>{fin();try{ok(gvizCell(o))}catch(e){no(e)}};sc.onerror=()=>{fin();no(new Error("load"))};sc.src=gvizUrl(code,"responseHandler:"+cb);document.head.appendChild(sc)})}
  async function gvizFetch(code){const t=await (await fetch(gvizUrl(code,"out:json"),{cache:"no-store"})).text();return gvizCell(JSON.parse(t.slice(t.indexOf("(")+1,t.lastIndexOf(")"))))}
  async function readKid(code){let L;try{L=await gvizJsonp(code)}catch(e){L=await gvizFetch(code)}if(!Array.isArray(L)||!L.length)throw new Error("empty");
    L=L.slice().sort((a,b)=>String(b.d).localeCompare(String(a.d)));const now=Date.now();let i=L.findIndex(x=>!x.at||Date.parse(x.at)<=now);if(i<0)i=L.length-1;return {L,i}}
  async function read(){/* 짧은 주소: hw.html?k=ja1106-james → hw/ja1106-james.json (2026-11-06) */const k=new URLSearchParams(location.search).get("k");
    if(k&&/^[\w-]{1,60}$/.test(k)){const r=await fetch("hw/"+k+".json",{cache:"no-cache"});if(!r.ok)throw new Error("no file");return r.json()}
    const h=location.hash.slice(1),p=new URLSearchParams(h);
    if(p.get("j"))return JSON.parse(p.get("j"));
    const z=p.get("z");if(!z)throw new Error("no data");
    const b=atob(z.replace(/-/g,"+").replace(/_/g,"/")),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
    const s=new Blob([u]).stream().pipeThrough(new DecompressionStream("deflate-raw"));return JSON.parse(await new Response(s).text())}
  const CK='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const KID={L:null,i:0,cur:0};
  function tabsHTML(){if(!KID.L)return "";const a=KID.L[KID.i],b=KID.L[KID.i+1];
    const ad=(()=>{try{return localStorage.getItem("enchool_a2hs_x")}catch(e){return "1"}})(),stand=(window.navigator.standalone===true)||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches);
    const ua=navigator.userAgent,ios=/iphone|ipad|ipod/i.test(ua),kakao=/KAKAOTALK/i.test(ua),inapp=kakao||/NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp/i.test(ua);
    /* 카톡 등 앱 안 브라우저에서는 홈 화면에 추가가 안 돼서 (2026-11-12 선생님 「카톡에서 열면 … 홈화면 추가 물어볼 것 같아」): 인터넷 앱으로 열기 버튼 → 거기서 브라우저별 안내 */
    /* 2026-11-12 선생님 「이걸 예시로 해두고 아래에 기종별로 방법안내」: 삼성 인터넷 그림을 예시로, 아래에 기종별 방법 — 지금 폰 줄은 표시 */
    const cur=kakao?"kakao":ios?(/CriOS/i.test(ua)?"ichrome":"safari"):/SamsungBrowser/i.test(ua)?"samsung":"chrome";
    const ROWS=[["kakao","💬 카톡에서 열었을 때","「인터넷에서 열기」 버튼 → 열린 화면의 안내대로"],["samsung","📱 삼성 인터넷","아래 오른쪽 점 세 개(⋮) → 「현재 페이지 추가」 → 「홈 화면」"],["chrome","📱 안드로이드 크롬","위 오른쪽 점 세 개(⋮) → 「설치 및 바로가기 만들기」(또는 「홈 화면에 추가」)"],["safari","🍎 아이폰 Safari","아래 공유 버튼(□↑) → 「홈 화면에 추가」"],["ichrome","🍎 아이폰 크롬","주소창 오른쪽 공유 버튼(□↑) → 「홈 화면에 추가」"]];
    const app=ios?"Safari":"인터넷(크롬)";
    return (!ad&&!stand?`<section class="a2hs" id="a2hs"><button type="button" id="a2x" aria-label="닫기">✕</button><b>📌 홈 화면에 추가해 두세요</b><br>다음부터 아이콘만 누르면 내 숙제가 바로 나와요.${kakao?`<small>카톡 안에서는 홈 화면에 추가가 안 돼요. 아래 버튼을 눌러 ${app}에서 연 다음 추가해 주세요.</small><a class="a2go" href="kakaotalk://web/openExternal?url=${encodeURIComponent(location.href)}">🌐 ${app}에서 열기</a>`:inapp?`<small>이 앱 안에서는 홈 화면에 추가가 안 돼요. ⋮ / ⋯ 메뉴 → 「다른 브라우저로 열기」 다음 추가해 주세요.</small>`:""}
      <div class="a2st"><span class="a2ex">예시 · 삼성 인터넷</span><b>① 아래 점 세 개(⋮)를 눌러요</b><img src="hw-a2hs-samsung.png" alt="화면 아래 오른쪽 점 세 개"><b>② 「현재 페이지 추가」 → 「홈 화면」</b></div>
      <div class="a2dv"><span class="a2ex">기종별 방법</span>${ROWS.map(([k,n,t])=>`<div class="a2r${k===cur?" on":""}"><b>${n}${k===cur?` <i>← 지금 이 폰</i>`:""}</b><span>${t}</span></div>`).join("")}</div></section>`:"")
     +(b?`<div class="tabs"><button type="button" class="tab${KID.cur===KID.i?" on":""}" data-k="${KID.i}">이번 숙제 · ${mds(a.d)}</button><button type="button" class="tab${KID.cur===KID.i+1?" on":""}" data-k="${KID.i+1}">지난 숙제 · ${mds(b.d)}</button></div>`:"")}
  function wireTabs(){const x=$("#a2x");if(x)x.addEventListener("click",()=>{try{localStorage.setItem("enchool_a2hs_x","1")}catch(e){}$("#a2hs").remove()});
    document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{KID.cur=+t.dataset.k;draw(KID.L[KID.cur]);scrollTo(0,0)}))}
  function draw(D){
    const key="enchool_hw_"+(D.sid||D.nm||"x")+"_"+D.d;let st={};try{st=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){}
    const save=()=>{try{localStorage.setItem(key,JSON.stringify(st))}catch(e){}};
    /* 체크하면 쌤 시트로 자동 보내기 (2026-11-06) — 휴대폰에 먼저 저장하고, 못 보냈으면 다음에 열 때 다시 보내요 */
    const PK=key+"_pending";let tm=null;
    const body=()=>JSON.stringify({a:"hwck",student:D.nm,sid:D.sid||"",cls:D.c||"",date:D.d,total:(D.it||[]).length,done:(D.it||[]).map((r,i)=>st[i]?(r.n||i+1):0).filter(Boolean)});
    /* 보내는 중에 또 체크하면, 끝난 뒤 최신 상태로 한 번 더 (늦게 도착한 옛날 기록이 덮어쓰지 않게) */let busy=false,again=false;
    const send=async()=>{if(!SEND_ON||!D.nm)return;if(busy){again=true;return}busy=true;again=false;
      try{const r=await fetch(LOG,{method:"POST",body:body()});const j=await r.json();if(!j||!j.ok)throw 0;if(!again)localStorage.removeItem(PK)}catch(e){}
      finally{busy=false;if(again)send()}};
    const queue=()=>{try{localStorage.setItem(PK,"1")}catch(e){}clearTimeout(tm);tm=setTimeout(send,1200)};
    /* 체크하고 바로 창을 닫아도 보내지게 */const flush=()=>{try{if(!SEND_ON||!D.nm||!localStorage.getItem(PK))return;clearTimeout(tm);fetch(LOG,{method:"POST",body:body(),keepalive:true}).catch(()=>{})}catch(e){}};
    addEventListener("pagehide",flush);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flush()});
    try{if(localStorage.getItem(PK))send()}catch(e){}
    $("#who").textContent=D.nm?(D.en&&D.en!==D.nm?D.en+" · "+D.nm:D.nm):"우리 반";$("#cls").textContent=D.c||"오늘의 숙제";
    document.title=KC?"엔쿨 숙제장":`${D.nm||""} 숙제 · ${mds(D.d)} — 엔쿨`;/* 아이 전용 주소: 홈 화면 바로가기 이름이 날짜 없이 「엔쿨 숙제장」으로 */
    const go=b=>`<a class="gob k-${esc(b.k)}" href="${esc(b.u)}"><b>${esc(b.l)}</b><small>${esc(String(b.s||"").replace(/^녹음 · /,""))}</small></a>`;
    const items=(D.it||[]),N=items.length;
    $("#app").innerHTML=tabsHTML()+`<section class="card top"><h1>${md(D.d)} 숙제</h1><p class="due">${D.due?`<b>${mds(D.due)}</b> 수업까지 해 와요`:"다음 수업까지 해 와요"}</p>
      <div class="prog"><div class="bar"><i id="pb"></i></div><span class="cnt" id="pc"></span></div></section>
      <section class="card done" id="dn" hidden><div class="ic">🎉</div><h2>오늘 숙제 끝!</h2><p>정말 잘했어요. 다음 수업에서 만나요 😊</p></section>
      <div class="list">${items.map((r,i)=>`<article class="it" data-i="${i}"><button class="ck" type="button" aria-label="${r.n||i+1}번 숙제 했어요">${CK}</button>
        <div class="bd"><div class="hd"><span class="num">${r.n||i+1}</span>${r.g?`<span class="tag">${esc(r.g)}</span>`:""}</div>
        <p class="tk">${esc(r.t)}</p>${r.x?`<p class="dt">${esc(r.x)}</p>`:""}${(r.b||[]).length?`<div class="go">${r.b.map(go).join("")}</div>`:""}</div></article>`).join("")}</div>
      ${(D.free||[]).length?`<section class="card"><div class="hd"><span class="tag">바로 가기</span></div><div class="go">${D.free.map(go).join("")}</div></section>`:""}
      <p class="foot">종이 숙제장과 같은 내용이에요.<br>${SEND_ON?"체크하면 선생님께 자동으로 전달돼요.":"체크한 건 이 휴대폰에 저장돼요."}</p>`;
    const paint=()=>{let n=0;document.querySelectorAll(".it").forEach(el=>{const on=!!st[el.dataset.i];el.classList.toggle("on",on);el.querySelector(".ck").setAttribute("aria-pressed",on);if(on)n++});
      $("#pb").style.width=(N?n/N*100:0)+"%";$("#pc").innerHTML=`${n} / ${N} <small>완료</small>`;$("#dn").hidden=!(N&&n===N)};
    document.querySelectorAll(".it .ck").forEach(b=>b.addEventListener("click",()=>{const i=b.closest(".it").dataset.i;st[i]=!st[i];if(!st[i])delete st[i];save();paint();queue();if(N&&Object.keys(st).length===N)$("#dn").scrollIntoView({behavior:"smooth",block:"center"})}));
    paint();wireTabs();
  }
  const fail=()=>{$("#app").innerHTML=`<div class="err">숙제장을 열지 못했어요 😢<br>${KC?"인터넷 연결을 확인하고 다시 열어 주세요. 계속 안 되면 선생님께 말해 주세요.":"선생님께 받은 링크를 처음부터 끝까지 다시 눌러 주세요."}</div>`};
  if(KC){if(!/^[a-z][a-z0-9]{5}$/.test(KC))fail();else{$("#app").innerHTML=`<p class="foot">숙제장을 불러오는 중…</p>`;readKid(KC).then(r=>{KID.L=r.L;KID.i=r.i;KID.cur=r.i;draw(r.L[r.i])}).catch(fail)}}
  else read().then(draw).catch(fail);
})();
</script>
</body>
</html>
