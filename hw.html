    const app=ios?"Safari":"인터넷(크롬)";
    /* 2026-11-12 선생님 「QR을 찍으면 저 안내가 상단에 접혀진 채로 나오고, 누르면 … 보여주면」: 안내문 전체를 접힌 한 줄로 · 누르면 아래로 펼쳐져요 */
    /* 2026-11-12 선생님 「지금 이 폰 이걸 상단 예시 이렇게 수정」 「추가가 어려우면 수업시간에 선생님께 문의!」: 맨 위 예시 = 지금 이 폰 방법(삼성은 그림), 아래는 다른 기종 */
    const STEP={samsung:["아래 오른쪽 점 세 개(⋮)를 눌러요","「현재 페이지 추가」 → 「홈 화면」"],chrome:["위 오른쪽 점 세 개(⋮)를 눌러요","「설치 및 바로가기 만들기」 → 「바로가기 만들기」 (또는 「홈 화면에 추가」)"],safari:["아래 가운데 공유 버튼(□↑)을 눌러요","「홈 화면에 추가」 → 「추가」"],ichrome:["주소창 오른쪽 공유 버튼(□↑)을 눌러요","「홈 화면에 추가」 → 「추가」"],kakao:["위의 「🌐 인터넷에서 열기」를 눌러요","열린 화면에서 이 안내대로 추가해요"]};
    const nmOf=k=>(ROWS.find(r=>r[0]===k)||[,""])[1],st2=STEP[cur]||STEP.chrome;
    const home=stand?"":`<div class="gd-s"><h3>📲 홈 화면에 추가하기 <small>· 한 번만!</small></h3><div class="a2st"><span class="a2ex">지금 이 폰 · ${nmOf(cur).replace(/^\S+\s/,"")}</span><b>① ${st2[0]}</b>${cur==="samsung"?`<img src="hw-a2hs-samsung.png" alt="화면 아래 오른쪽 점 세 개">`:""}<b>② ${st2[1]}</b></div>
      <div class="a2dv"><span class="a2ex">다른 기종</span>${ROWS.filter(([k])=>k!==cur).map(([k,n,t])=>`<div class="a2r"><b>${n}</b><span>${t}</span></div>`).join("")}</div><p class="a2ask">🙋 추가가 어려우면 수업 시간에 선생님께 물어봐요!</p></div>`;
    return (kakao&&!stand?`<section class="a2hs a2k"><b>📌 카톡 안에서는 홈 화면에 추가가 안 돼요</b><small>아래 버튼을 눌러 ${app}에서 연 다음 추가해 주세요.</small><a class="a2go" href="kakaotalk://web/openExternal?url=${encodeURIComponent(location.href)}">🌐 ${app}에서 열기</a></section>`:inapp&&!stand?`<section class="a2hs a2k"><small>이 앱 안에서는 홈 화면에 추가가 안 돼요. ⋮ / ⋯ 메뉴 → 「다른 브라우저로 열기」</small></section>`:"")
     +`<details class="gd" id="gd"><summary><span class="gd-tt"><span class="gd-t">📌 처음이면 꼭 읽어요</span><span class="gd-s2">${stand?"":"홈 화면 추가 · "}숙제 체크 방법 · 눌러서 보기</span></span><span class="gd-c">▾</span></summary><div class="gd-b">${home}
      <div class="gd-s"><h3>✏️ 숙제는 꼭 순서대로, 하면서 바로 체크해요</h3><ol class="gd-o"><li><b>1번부터 순서대로</b> 해요. 건너뛰지 않아요.</li><li>쿨보카·녹음·쿨톡 버튼은 <b>끝까지</b> 하고 「📮 선생님께 보내기」까지 눌러요.</li><li>한 숙제를 끝내자마자 <b>바로 ☐ 체크</b>해요. 나중에 몰아서 하지 않아요.</li><li>다 체크하면 <b>🎉 오늘 숙제 끝!</b>이 나와요.</li></ol></div>
      <div class="gd-s gd-n"><b>🔗 체크하면 선생님 프로그램에 바로 연결돼요</b><span>체크한 내용은 엔쿨 학습관리 프로그램 수업 기록에 자동으로 들어가요. 선생님이 수업 전에 확인해요.</span></div>
      <div class="gd-s gd-g"><div><b>✅ 다 한 것만 체크</b><span>끝까지 다 한 다음에 체크해요.</span></div><div><b>👀 선생님이 확인해요</b><span>앱 기록·녹음·사진·종이 숙제로 맞게 체크했는지 확인해요.</span></div><div class="w"><b>⚠️ 안 했는데 체크하면</b><span>코인이 차감돼요. 정직하게 체크해요.</span></div></div>
     </div></details>`
     +(b?`<div class="tabs"><button type="button" class="tab${KID.cur===KID.i?" on":""}" data-k="${KID.i}">이번 숙제 · ${mds(a.d)}</button><button type="button" class="tab${KID.cur===KID.i+1?" on":""}" data-k="${KID.i+1}">지난 숙제 · ${mds(b.d)}</button></div>`:"")}
  function wireTabs(){const x=$("#a2x");if(x)x.addEventListener("click",()=>{try{localStorage.setItem("enchool_a2hs_x","1")}catch(e){}$("#a2hs").remove()});
    document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{KID.cur=+t.dataset.k;draw(KID.L[KID.cur]);scrollTo(0,0)}))}
  /* 📄 영작 종이: D.bm = {bk, ex, S:[[과, 번호, 한글, 영어]], D:[{d, fd, t, lab, R, rv, i:[문장 번호], ph}]} — 학습관리실 bmKidPages 워크시트와 같은 내용 */
  function bmBl(e){let pre="";const m=String(e).match(/^(\d+\.)\s+/);if(m){pre=`<i>${m[1]}</i>`;e=e.slice(m[0].length)}
    return pre+(String(e).match(/[A-Za-z0-9'\-,.]*[A-Za-z0-9]+[A-Za-z0-9'\-,]*|[^\sA-Za-z0-9'\-]/g)||[]).map(t=>{if(/[A-Za-z0-9]/.test(t)){const w=t.replace(/,$/,"");return `<span class="bl" style="width:${Math.max(26,Math.round(w.length*8.5+14))}px"></span>`+(t.endsWith(",")?"<i>,</i>":"")}return `<i>${esc(t)}</i>`}).join("")}
  function bmOpen(D,k){const B=D.bm,x=B&&B.D&&B.D[k];if(!x)return;document.querySelector(".bmo")?.remove();
    const Q=x.i.map(j=>B.S[j]).filter(Boolean),pad=n=>String(n).padStart(2,"0");
    const card=(q,n,ans)=>`<div class="bq${ans?" ans":""}" data-n="${n}"><div class="bq-no"><b>${n}</b><small>${esc(q[0])}과 ${pad(q[1])}</small></div><div class="bq-b"><div class="bq-ko">${esc(q[2])}</div><div class="bq-wr">${bmBl(q[3])}</div><div class="bq-en">${esc(q[3])}</div><span class="bq-hint">👆 누르면 이 문제 정답 · 다시 누르면 문제</span></div></div>`;
    const o=document.createElement("div");o.className="bmo";
    o.innerHTML=`<div class="bmo-bar"><div class="bmo-bi"><button type="button" class="bmo-x">✕ 닫기</button><div class="bmo-tt"><b>${esc(x.t)}</b><span>${esc(D.nm||"")} · ${esc(B.bk||"")} · ${esc(x.R)}</span></div><div class="bmo-dt"><b>${esc(x.lab)}</b><span>${esc(x.fd||"")}</span></div></div></div>
      <div class="bmo-in"><div class="bmo-sw"><button type="button" data-s="f" class="on">📄 앞장 · 문제</button><button type="button" data-s="b">✅ 뒷장 · 정답</button></div>
      <div id="bmf"><div class="bmo-tip">${x.rv?`<b>지금까지 외운 ${Q.length}문장 전체 복습</b> · 할 수 있는 만큼 써 보고 정답으로 채점해요`:`본문을 외운 뒤 <b>책을 보지 않고</b> 공책이나 종이에 써 보세요 · 밑줄 하나 = 단어 하나`}<br>다 쓰면 「뒷장 · 정답」으로 채점! 한 문제씩 보려면 문제를 눌러요.</div>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">${Q.map((q,n)=>card(q,n+1,0)).join("")}</div></div>
      <div id="bmb" hidden><div class="bmo-tip">틀린 단어는 빨간 펜으로 고치고, 틀린 문장은 한 번 더 써 보세요.</div>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">${Q.map((q,n)=>card(q,n+1,1)).join("")}</div>
        <div class="bmo-rd" style="margin-top:10px">🗣 소리 내어 3번 읽기 · 틀린 개수 세어 보기</div></div>
      ${x.ph?`<a class="bmo-ph" href="${esc(x.ph)}">📷 다 쓰면 사진 찍어 선생님께 보내기<small>채점까지 한 다음에</small></a>`:""}</div>`;
    document.body.appendChild(o);document.body.style.overflow="hidden";
    const close=()=>{o.remove();document.body.style.overflow=""};
    o.querySelector(".bmo-x").addEventListener("click",()=>{if(history.state&&history.state.bm)history.back();else close()});
    o.querySelectorAll(".bmo-sw button").forEach(b=>b.addEventListener("click",()=>{const f=b.dataset.s==="f";o.querySelectorAll(".bmo-sw button").forEach(z=>z.classList.toggle("on",z===b));o.querySelector("#bmf").hidden=!f;o.querySelector("#bmb").hidden=f;o.scrollTo(0,0)}));
    o.querySelectorAll("#bmf .bq").forEach(c=>c.addEventListener("click",()=>c.classList.toggle("flip")));
    try{history.pushState({bm:1},"")}catch(e){}const pop=()=>{close();removeEventListener("popstate",pop)};addEventListener("popstate",pop)}
  function draw(D){
    const key="enchool_hw_"+(D.sid||D.nm||"x")+"_"+D.d;let st={};try{st=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){}
    const save=()=>{try{localStorage.setItem(key,JSON.stringify(st))}catch(e){}};
    /* 체크하면 쌤 시트로 자동 보내기 (2026-11-06) — 휴대폰에 먼저 저장하고, 못 보냈으면 다음에 열 때 다시 보내요 */
    const PK=key+"_pending";let tm=null;
    const body=()=>JSON.stringify({a:"hwck",student:D.nm,sid:D.sid||"",cls:D.c||"",date:D.d,total:(D.it||[]).length,done:(D.it||[]).map((r,i)=>st[i]?(r.n||i+1):0).filter(Boolean)});
    /* 보내는 중에 또 체크하면, 끝난 뒤 최신 상태로 한 번 더 (늦게 도착한 옛날 기록이 덮어쓰지 않게) */let busy=false,again=false;
    const send=async()=>{if(!SEND_ON||!D.nm)return;if(busy){again=true;return}busy=true;again=false;
      try{const r=await fetch(LOG,{method:"POST",body:body()});const j=await r.json();if(!j||!j.ok)throw 0;if(!again)localStorage.removeItem(PK)}catch(e){}
      finally{busy=false;if(again)send()}};
    const queue=()=>{try{localStorage.setItem(PK,"1")}catch(e){}clearTimeout(tm);tm=setTimeout(send,1200)};
    /* 체크하고 바로 창을 닫아도 보내지게 */const flush=()=>{try{if(!SEND_ON||!D.nm||!localStorage.getItem(PK))return;clearTimeout(tm);fetch(LOG,{method:"POST",body:body(),keepalive:true}).catch(()=>{})}catch(e){}};
    addEventListener("pagehide",flush);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flush()});
    try{if(localStorage.getItem(PK))send()}catch(e){}
    $("#who").textContent=D.nm?(D.en&&D.en!==D.nm?D.en+" · "+D.nm:D.nm):"우리 반";$("#cls").textContent=D.c||"오늘의 숙제";
    document.title=KC?"엔쿨 숙제장":`${D.nm||""} 숙제 · ${mds(D.d)} — 엔쿨`;/* 아이 전용 주소: 홈 화면 바로가기 이름이 날짜 없이 「엔쿨 숙제장」으로 */
    const go=b=>`<a class="gob k-${esc(b.k)}" href="${esc(b.u)}"><b>${esc(b.l)}</b><small>${esc(String(b.s||"").replace(/^녹음 · /,""))}</small></a>`;
    const items=(D.it||[]),N=items.length;
    $("#app").innerHTML=tabsHTML()+`<section class="card top"><h1>${md(D.d)} 숙제</h1><p class="due">${D.due?`<b>${mds(D.due)}</b> 수업까지 해 와요`:"다음 수업까지 해 와요"}</p>
      <div class="prog"><div class="bar"><i id="pb"></i></div><span class="cnt" id="pc"></span></div></section>
      <section class="card done" id="dn" hidden><div class="ic">🎉</div><h2>오늘 숙제 끝!</h2><p>정말 잘했어요. 다음 수업에서 만나요 😊</p></section>
      <div class="list">${items.map((r,i)=>`<article class="it" data-i="${i}"><button class="ck" type="button" aria-label="${r.n||i+1}번 숙제 했어요">${CK}</button>
        <div class="bd"><div class="hd"><span class="num">${r.n||i+1}</span>${r.g?`<span class="tag">${esc(r.g)}</span>`:""}</div>
        <p class="tk">${esc(r.t)}</p>${r.x?`<p class="dt">${esc(r.x)}</p>`:""}${(r.b||[]).length?`<div class="go">${r.b.map(go).join("")}</div>`:""}</div></article>`).join("")}</div>
      ${(D.free||[]).length?`<section class="card"><div class="hd"><span class="tag">바로 가기</span></div><div class="go">${D.free.map(go).join("")}</div></section>`:""}
      <p class="foot">종이 숙제장과 같은 내용이에요.<br>${SEND_ON?"체크하면 선생님께 자동으로 전달돼요.":"체크한 건 이 휴대폰에 저장돼요."}</p>`;
    const paint=()=>{let n=0;document.querySelectorAll(".it").forEach(el=>{const on=!!st[el.dataset.i];el.classList.toggle("on",on);el.querySelector(".ck").setAttribute("aria-pressed",on);if(on)n++});
      $("#pb").style.width=(N?n/N*100:0)+"%";$("#pc").innerHTML=`${n} / ${N} <small>완료</small>`;$("#dn").hidden=!(N&&n===N)};
    document.querySelectorAll(".it .ck").forEach(b=>b.addEventListener("click",()=>{const i=b.closest(".it").dataset.i;st[i]=!st[i];if(!st[i])delete st[i];save();paint();queue();if(N&&Object.keys(st).length===N)$("#dn").scrollIntoView({behavior:"smooth",block:"center"})}));
    document.querySelectorAll('a.gob[href^="#bm"]').forEach(a=>a.addEventListener("click",e=>{e.preventDefault();bmOpen(D,+a.getAttribute("href").slice(3))}));
    paint();wireTabs();
  }
  const fail=()=>{$("#app").innerHTML=`<div class="err">숙제장을 열지 못했어요 😢<br>${KC?"인터넷 연결을 확인하고 다시 열어 주세요. 계속 안 되면 선생님께 말해 주세요.":"선생님께 받은 링크를 처음부터 끝까지 다시 눌러 주세요."}</div>`};
  if(KC){if(!/^[a-z][a-z0-9]{5}$/.test(KC))fail();else{$("#app").innerHTML=`<p class="foot">숙제장을 불러오는 중…</p>`;readKid(KC).then(r=>{KID.L=r.L;KID.i=r.i;KID.cur=r.i;draw(r.L[r.i])}).catch(fail)}}
  else read().then(draw).catch(fail);
})();
</script>
</body>
