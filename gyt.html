<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>기적영트 실습</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gaegu:wght@400;700&display=swap">
<style>
:root{--navy:#102f5e;--navy2:#1d4a8a;--gold:#f2c94c;--bg:#f4f1ea;--card:#fff;--ink:#1d2433;--muted:#6b7280;--line:#e3ddd0;--ok:#1f9d55;--okbg:#e6f6ec;--bad:#d64545;--badbg:#fdeaea;--blue:#2f6fd0;
 --memoY:#fff3a8;--memoB:#cdeef3;--chatbg:#5b84c9;--me:#ffd23f;--mom:#ffffff;--f:"Noto Sans KR",system-ui,sans-serif;--hand:"Gaegu","Noto Sans KR",cursive}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 60px}
header.top{background:var(--navy);color:#fff;border-radius:18px;padding:18px 18px 14px;position:relative;overflow:hidden}
header.top:after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(242,201,76,.18)}
.hrow{display:flex;align-items:center;gap:14px;position:relative;z-index:1}.hlogo{width:58px;height:58px;border-radius:14px;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden}.hlogo img{width:52px;height:auto;display:block}
.brand{font-size:11px;letter-spacing:.18em;color:var(--gold);font-weight:900}
h1{margin:4px 0 2px;font-size:clamp(24px,6vw,32px);font-weight:900;letter-spacing:-.02em}
h1 small{display:block;font-size:13px;font-weight:500;color:rgba(255,255,255,.75);letter-spacing:0;margin-top:2px}
.prog{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.pchip{font-size:12px;font-weight:700;background:rgba(255,255,255,.12);border-radius:999px;padding:3px 10px}
.pchip b{color:var(--gold)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 14px}
.tab{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 6px;font-weight:900;color:var(--navy);display:flex;flex-direction:column;align-items:center;gap:2px}
.tab span{font-size:12px;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--navy);background:var(--navy);color:#fff}
.tab[aria-selected="true"] span{color:var(--gold)}
.intro{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.intro p{margin:0;font-size:14px;color:var(--muted)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.btn.pri{background:var(--navy);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
/* blanks */
.bl{display:inline-flex;align-items:center;vertical-align:baseline;margin:0 2px}
.bl input{font:inherit;font-weight:700;border:0;border-bottom:2.5px solid var(--navy2);background:rgba(255,255,255,.55);border-radius:6px 6px 0 0;padding:1px 6px;min-width:4em;color:var(--navy);outline:none;text-align:center}
.bl input:focus{background:#fff;box-shadow:0 0 0 2px var(--gold)}
.bl.ok input{border-color:var(--ok);color:var(--ok);background:var(--okbg)}
.bl.bad input{border-color:var(--bad);color:var(--bad);background:var(--badbg);animation:shake .3s}
.bl.shown{flex-direction:column;align-items:stretch}
.bl.shown input{border-color:var(--gold);color:var(--bad);background:#fff7d6}
.bl.shown.ok input{border-color:var(--ok);color:var(--ok);background:var(--okbg)}
.bl .ans{display:block;font-family:var(--f);font-size:12.5px;font-weight:700;line-height:1.3;color:#8a6a00;background:#fff3c4;border-radius:0 0 6px 6px;padding:2px 6px;text-align:left}
.bl.ok .ans{display:none}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.ko{font-family:var(--hand);font-size:17px;color:#5b5f6a;display:block;margin-top:2px}
.hintline{font-size:13px;color:var(--bad);min-height:1.2em;margin:4px 0 0}
.hintline.good{color:var(--ok);font-weight:700}
.rowtools{display:flex;gap:6px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;color:var(--navy)}
.mini.chk{background:var(--navy);color:#fff;border-color:var(--navy)}
/* memo */
.memos{display:flex;flex-direction:column;gap:18px}
.memo{position:relative;padding:22px 20px 16px;border-radius:4px;box-shadow:0 6px 14px rgba(0,0,0,.08);font-family:var(--hand);font-size:21px;line-height:1.7;max-width:560px}
.memo:nth-child(odd){background:var(--memoY);transform:rotate(-.6deg)}
.memo:nth-child(even){background:var(--memoB);transform:rotate(.6deg);margin-left:auto}
.memo .pin{position:absolute;top:10px;right:14px;width:14px;height:14px;border-radius:50%;background:#2fb39c;box-shadow:inset -2px -2px 0 rgba(0,0,0,.15)}
.memo .no{position:absolute;left:-10px;top:-10px;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-family:var(--f);font-size:14px;font-weight:900;display:grid;place-items:center}
.memo .sig{text-align:right;font-weight:700}
.memo .bl input{font-family:var(--hand);font-size:20px}
/* chat */
.phone{background:var(--chatbg);border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(16,47,94,.25);max-width:520px;margin:0 auto}
.pbar{background:#f2f2f6;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;font-size:14px;color:#2f6fd0}
.pbar b{color:#111;font-size:17px}
.chat{min-height:360px;max-height:62vh;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.av{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:22px;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.bub{border-radius:18px;padding:9px 14px;font-family:var(--hand);font-size:19px;line-height:1.55;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.msg.mom .bub{background:var(--mom);border-bottom-left-radius:4px}
.msg.me .bub{background:var(--me);border-bottom-right-radius:4px}
.bub .ko{font-size:15px}
.bub .bl input{font-family:var(--hand);font-size:18px;min-width:3.5em}
.typing{display:inline-flex;gap:4px;padding:12px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:#9aa3b2;animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}
.compose{background:#f2f2f6;padding:10px 12px;border-top:1px solid #dcdce4}
.compose .lab{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px}
.compose .draft{background:#fff;border:1px solid #d8d8e0;border-radius:16px;padding:8px 12px;font-family:var(--hand);font-size:19px;line-height:1.6}
.compose .draft .ko{font-size:15px}
.compose .send{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.sendbtn{background:var(--blue);color:#fff;border:0;border-radius:999px;padding:7px 18px;font-weight:900}
.sendbtn:disabled{opacity:.4}
.done{text-align:center;padding:14px;font-weight:900;color:#fff}
/* diary */
.diaries{display:flex;flex-direction:column;gap:20px}
.diary{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);background:#fff;border-radius:16px;box-shadow:0 6px 16px rgba(0,0,0,.07);overflow:hidden;border:1px solid var(--line)}
.diary .en{padding:16px 18px;border-right:2px dashed #d9c9a6;font-family:var(--hand);font-size:20px;line-height:1.85;background:repeating-linear-gradient(#fff 0 34px,#eef2fa 34px 35px)}
.diary .kr{padding:16px 16px;background:#fffaf0;font-family:var(--hand);font-size:17px;line-height:1.9;color:#5b5f6a}
.diary h3{margin:0 0 4px;font-family:var(--f);font-size:15px;font-weight:900;color:var(--navy)}
.diary .kr h3{color:#8a6a00}
.diary .bl input{font-family:var(--hand);font-size:19px}
.dno{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:900;margin-right:6px;font-family:var(--f)}
@media (max-width:560px){.diary{grid-template-columns:1fr}.diary .en{border-right:0;border-bottom:2px dashed #d9c9a6}.memo{font-size:19px}.memo .bl input{font-size:18px}}
.words{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:14px}
.words b{color:var(--navy)}
.words span{display:inline-block;margin:2px 10px 2px 0}
.score{position:sticky;bottom:10px;margin-top:18px;background:var(--navy);color:#fff;border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(16,47,94,.3)}
.score b{color:var(--gold);font-size:18px}
.cheer{position:fixed;inset:0;background:rgba(16,47,94,.6);display:grid;place-items:center;z-index:20}
.cheer[hidden]{display:none}
.cheer div{background:#fff;border-radius:20px;padding:26px 24px;text-align:center;max-width:320px;margin:16px}
.cheer .big{font-size:46px}
.cheer h2{margin:4px 0;color:var(--navy)}
:root{--full:1}
.bl.full{display:flex;width:100%;margin:6px 0}.bl.full input{width:100%!important;text-align:left;font-size:.95em}
.msg:has(.bl.full){width:88%}.msg:has(.bl.full) .bub{flex:1}
.diary.adv{grid-template-columns:1fr}.diary.adv .kr{display:none}.diary.adv .en{border-right:0}
.bl.full .ft{display:block;font-weight:700;padding:2px 8px;border-radius:6px;border-bottom:2.5px solid var(--ok);color:var(--ok);background:var(--okbg);text-align:left}.bl.full.shown .ft{border-color:var(--gold);color:#8a6a00;background:#fff7d6}
b.given{color:var(--navy2);font-weight:700}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0;font-family:var(--f)}
.chip{border:1.5px dashed var(--navy2);background:#fff;color:var(--navy);border-radius:999px;padding:3px 12px;font-size:15px;font-weight:700}
.chip.used{opacity:.3;text-decoration:none;border-style:solid}
.who{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.who .me{background:#fff;color:var(--navy);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:900}
.who .lv{background:var(--gold);color:var(--navy);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:900}
.who button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:999px;padding:3px 10px;font-size:12px}
.start{position:fixed;inset:0;background:rgba(16,47,94,.75);display:grid;place-items:center;z-index:30;padding:16px}
.start[hidden]{display:none}
.start .box{background:#fff;border-radius:20px;padding:22px 20px;width:100%;max-width:380px}
.start h2{margin:0 0 4px;color:var(--navy);font-size:20px}
.start p{margin:0 0 14px;color:var(--muted);font-size:13px}
.start label{display:block;font-weight:900;color:var(--navy);font-size:14px;margin:10px 0 6px}
.start input{width:100%;font:inherit;font-size:17px;border:2px solid var(--line);border-radius:12px;padding:9px 12px;outline:none}
.start input:focus{border-color:var(--navy)}
.lvs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvb{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 4px;text-align:center;color:var(--navy);font-weight:900}
.lvb span{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin-top:2px;line-height:1.35}
.lvb[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:#fff}.lvb[aria-pressed="true"] span{color:var(--gold)}
.start .go{width:100%;margin-top:16px;padding:11px;font-size:16px}
.sendrow{display:flex;flex-direction:column;gap:8px;align-items:center}
a.btn{text-decoration:none;display:inline-block}
.must{margin:0 0 12px;background:#fdeaea;color:var(--bad);border-radius:12px;padding:8px 10px;font-size:13.5px;font-weight:700;line-height:1.5}.must b{color:var(--navy)}.must.pulse{animation:shake .4s 2}
.cheer .sendrow,.cheer .nextrow{padding:0;margin:0;max-width:none;border-radius:0;background:none}
a.btn[hidden]{display:none}
.nextrow{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:4px}.nextrow .btn{padding:9px 14px;font-size:14px}
.sentok{color:var(--ok);font-weight:900;font-size:14px}
footer{font-size:12px;color:var(--muted);text-align:center;margin-top:22px}
</style>

let NAME="",LEVEL="mid";try{NAME=localStorage.getItem("gyt_nm")||"";LEVEL=localStorage.getItem("gyt_lv")||"mid"}catch(e){}
function variants(seg){let outs=[""];seg.split(/(\[[^\]]+\])/).forEach(t=>{if(/^\[.*\]$/.test(t)){const al=t.slice(1,-1).split("|");outs=outs.flatMap(o=>al.map(a=>o+a))}else outs=outs.map(o=>o+t)});return outs.map(o=>o.trim())}
function tf(en,c,all){if(LEVEL==="mid")return en;
 if(LEVEL==="adv")return en.split("<br>").map(x=>(all||/\[/.test(x))?"["+variants(x).join("|")+"]":x).join("<br>");
 return en.replace(/\[([^\]]+)\]/g,(m,a)=>(c.i++<3)?m:`⟨${a.split("|")[0]}⟩`)}
function getData(t){if(t==="memo")return MEMO.map(m=>{const c={i:0};return {...m,lines:m.lines.map(l=>({...l,en:tf(l.en,c,false)}))}});
 if(t==="chat")return CHAT.map(m=>{const c={i:0};return m.who==="mom"?{...m,en:tf(m.en,c,false)}:{...m,parts:m.parts.map(p=>({...p,en:tf(p.en,c,false)}))}});
 return DIARY.map(d=>{const c={i:0};return {...d,en:d.en.map(x=>tf(x,c,true))}})}
let CD=[],T0=Date.now(),SENT=false;const WRONG={};
function bankFor(grp){if(LEVEL!=="easy")return "";const a=Object.entries(ANS).filter(([k,o])=>o.g===grp).map(([k,o])=>o.a[0]);if(!a.length)return "";
 const sh=a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);return `<div class="bank" data-bank="${grp}">${sh.map(x=>`<button class="chip" data-chip="${esc(x)}" data-g="${grp}">${esc(x)}</button>`).join("")}</div>`}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tab="memo",uid=0;const ANS={};const TRIES={};const STATE={memo:{},chat:{},diary:{}};
const norm=s=>String(s||"").toLowerCase().replace(/[’`]/g,"'").replace(/won't/g,"will not").replace(/can't/g,"can not").replace(/n't/g," not").replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim();
function blanks(en,grp,ph){return en.replace(/\[([^\]]+)\]/g,(m,a)=>{const id="b"+(++uid);const al=a.split("|");const full=al[0].split(" ").length>=4;ANS[id]={a:al,g:grp,full};const w=Math.max(4,Math.round(al[0].length*0.62));return `<span class="bl${full?" full":""}" data-id="${id}"><input id="${id}" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:${w+1}em" aria-label="빈칸"${ph?` placeholder="${esc(ph)}"`:""}></span>`}).replace(/⟨([^⟩]+)⟩/g,'<b class="given">$1</b>')}
const plain=en=>en.replace(/<br>/g," ").replace(/⟨([^⟩]+)⟩/g,"$1").replace(/\[([^\]]+)\]/g,(m,a)=>a.split("|")[0]);
function speak(t,who){t=String(t).replace(/❤/g,"").replace(/\s+/g," ").trim();try{window.TTSA&&TTSA.stop()}catch(e){}if(window.TTSA&&TTSA.play(t,who||""))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/❤/g,""));u.lang="en-US";u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function check(grp){let all=true,newly=0;document.querySelectorAll(`.bl`).forEach(sp=>{const id=sp.dataset.id,o=ANS[id];if(!o||o.g!==grp)return;const inp=$("#"+id);if(sp.classList.contains("ok"))return;
  const v=norm(inp.value);if(o.a.some(a=>norm(a)===v)){sp.classList.add("ok");sp.classList.remove("bad");inp.readOnly=true;newly++;if(sp.classList.contains("shown"))STATE[tab]["f"+id]=1;else STATE[tab][id]=1;fullDone(sp)}
  else{all=false;sp.classList.remove("bad");void sp.offsetWidth;sp.classList.add("bad");TRIES[id]=(TRIES[id]||0)+(v?1:0);if(v)WRONG[id]=`${o.a[0]} ← ${inp.value.trim()}`;if(TRIES[id]>=2){const h=o.full?o.a[0].split(" ").slice(0,2).join(" "):o.a[0][0];if(!sp.classList.contains("shown"))inp.placeholder=h+"…"}}});
  const msg=document.querySelector(`[data-hint="${grp}"]`);if(msg){msg.className="hintline"+(all?" good":"");msg.textContent=all?"👍 다 맞았어요!":document.querySelector(`.bl.shown:not(.ok) input[data-g="${grp}"]`)?"노란 정답을 보고 내가 쓴 걸 고쳐서 다시 확인해요.":(LEVEL==="adv"?"빨간 칸을 다시 써 보세요. 두 번 틀리면 첫 단어를 알려줘요.":"빨간 칸을 다시 써 보세요. 두 번 틀리면 첫 글자를 알려줘요.")}
  score();return all}
function fullDone(sp){const o=ANS[sp.dataset.id];if(!o||!o.full||sp.querySelector(".ft"))return;const inp=sp.querySelector("input");inp.style.display="none";sp.insertAdjacentHTML("beforeend",`<span class="ft">${esc(inp.value)}</span>`)}
function reveal(grp){document.querySelectorAll(`.bl`).forEach(sp=>{const o=ANS[sp.dataset.id];if(!o||o.g!==grp||sp.classList.contains("ok"))return;const id=sp.dataset.id,inp=$("#"+id);if(!inp.value.trim())WRONG[id]=WRONG[id]||`${o.a[0]} ← (빈칸)`;STATE[tab]["s"+id]=1;inp.dataset.g=grp;inp.readOnly=false;inp.placeholder="";sp.classList.remove("bad");sp.classList.add("shown");
  if(!sp.querySelector(".ans"))sp.insertAdjacentHTML("beforeend",`<span class="ans">정답 · ${esc(o.a[0])}</span>`)});
 const first=[...document.querySelectorAll(".bl.shown:not(.ok) input")].find(x=>x.dataset.g===grp);first&&first.focus();
 const msg=document.querySelector(`[data-hint="${grp}"]`);if(msg){msg.className="hintline";msg.textContent="노란 정답을 보고 내가 쓴 걸 고쳐서 다시 확인해요."}score()}
function total(t){return Object.values(ANS).filter(o=>o.g.startsWith(t)).length}
function totalOf(t){const G=getData(t);const D=t==="memo"?G.map(m=>m.lines.map(l=>l.en).join(" ")):t==="chat"?G.map(m=>m.en||m.parts.map(p=>p.en).join(" ")):G.map(d=>d.en.join(" "));return (D.join(" ").match(/\[/g)||[]).length}
function score(){const n=totalOf(tab),ok=Object.keys(STATE[tab]).filter(k=>/^b\d/.test(k)).length;$("#sc")&&($("#sc").innerHTML=`맞힌 빈칸 <b>${ok}</b> / ${n}`);
  const fin=tab==="chat"?chatStep>=CD.length:ok+Object.keys(STATE[tab]).filter(k=>/^fb/.test(k)).length>=n;
  if(n&&fin&&!STATE[tab].cheered){STATE[tab].cheered=1;cheer(ok,n)}}
function cheer(ok,n,part){const T={memo:"메모 완성!",chat:jo(GD.peerKo||"엄마","이랑","랑")+" 대화 완성!",diary:"일기 4편 완성!"};const shown=Object.keys(STATE[tab]).filter(k=>/^sb/.test(k)).length;
 const sec=Math.round((Date.now()-T0)/1000),tm=`${Math.floor(sec/60)}분 ${sec%60}초`;
 $("#cheerI").textContent=part?"📮":"🎉";$("#cheerT").textContent=part?"여기까지 보낼까요?":T[tab];$("#cheerP").textContent=`${NAME||"이름 없음"} · ${LVN[LEVEL]} · 스스로 맞힘 ${ok}/${n}${shown?` · 정답 보고 고침 ${shown}`:""} · ${tm}`;
 const ua=navigator.userAgent,dev=/iPad|Tablet|Android(?!.*Mobile)/i.test(ua)?"태블릿":/Mobi|iPhone|Android/i.test(ua)?"폰":"PC";
 const wr=Object.values(WRONG);const q={name:NAME||"이름 없음",prac:"기적영트 실습 "+(GD.code||"").toUpperCase()+" "+TABN[tab],lv:LVN[LEVEL],score:`${ok}/${n}${part?" (중간)":""}`,shown:String(shown),wrong:wr.length?wr.join(" / "):"없음",time:tm,dev};
 $("#sendT").href=FORM+"?"+Object.entries(q).map(([k,v])=>"entry."+FE[k]+"="+encodeURIComponent(v)).join("&")+"&submit=Submit";
 SENT=false;warned=false;$("#nextRow").hidden=true;$("#mustMsg").hidden=false;$("#mustMsg").innerHTML="⚠️ 꼭 <b>📮 선생님께 보내기</b>를 눌러야<br>선생님이 오늘 연습한 걸 확인할 수 있어요!";$("#cheerX").textContent="닫기";$("#sendT").hidden=false;$("#sentOk").hidden=true;$("#cheer").hidden=false}
$("#sendT").addEventListener("click",()=>{SENT=true;setTimeout(()=>{$("#sendT").hidden=true;$("#sentOk").hidden=false;$("#mustMsg").hidden=true;$("#cheerX").textContent="닫기";
  const NL={easy:"mid",mid:"adv"}[LEVEL],TO=["memo","chat","diary"],NT=TO[TO.indexOf(tab)+1];let h="";
  if(NL)h+=`<button class="btn pri" data-nextlv="${NL}">⬆ ${LVN[NL]}으로 다시 도전</button>`;
  if(NT)h+=`<button class="btn gold" data-nexttab="${NT}">다음: ${TABN[NT]} ▶</button>`;
  if(!NL&&!NT)h=`<span class="sentok">🏆 고급까지 끝! 정말 잘했어요</span>`;
  $("#nextRow").innerHTML=h;$("#nextRow").hidden=false},300)});
let warned=false;$("#cheerX").onclick=()=>{if(!SENT&&!warned){warned=true;const m=$("#mustMsg");m.classList.remove("pulse");void m.offsetWidth;m.classList.add("pulse");m.innerHTML="✋ 아직 안 보냈어요!<br><b>📮 선생님께 보내기</b>를 먼저 눌러요.";$("#cheerX").textContent="그래도 닫기";return}$("#cheer").hidden=true};

function renderMemo(){let h=`<div class="intro"><p>쪽지를 완성해요. 우리말을 보고 빈칸에 영어를 써요.</p><div class="tools"><button class="btn" data-reset>처음부터</button></div></div><div class="memos">`;
 getData("memo").forEach((m,i)=>{const g="memo"+i;h+=`<div class="memo"><span class="no">${i+1}</span><span class="pin"></span><div>${m.to}</div>${m.lines.map(l=>`<div>${blanks(l.en,g)}${l.ko?`<span class="ko">(${l.ko})</span>`:""}</div>`).join("")}<div class="sig">${m.sig}</div>${bankFor(g)}
  <p class="hintline" data-hint="${g}"></p><div class="rowtools"><button class="mini" data-say="${esc(m.to+" "+m.lines.map(l=>plain(l.en)).join(" ")+" "+m.sig)}">🔊 듣기</button><button class="mini" data-show="${g}">정답 보기</button><button class="mini chk" data-chk="${g}">확인</button></div></div>`});
 return h+`</div>`}
let chatStep=0,chatTimer=null;
function renderChat(){chatStep=0;CD=getData("chat");return `<div class="intro"><p>${jo(GD.peerKo||"엄마","이랑","랑")} 문자를 주고받아요. 내 차례가 오면 빈칸을 채워 <b>문자 전송</b>!</p><div class="tools"><button class="btn" data-reset>처음부터</button></div></div>
 <div class="phone"><div class="pbar"><span>‹ Messages</span><b>${esc(GD.peer||"Mom")}</b><span>Contact</span></div><div class="chat" id="chat"></div><div class="compose" id="compose"></div></div>`}
function bubble(m,grp){return m.who==="mom"?`<div class="msg mom"><div class="av">${GD.peerAv||"👩"}</div><div class="bub">${blanks(m.en,grp)}${m.ko?`<span class="ko">(${m.ko})</span>`:""}${/\[/.test(m.en)?`${bankFor(grp)}<div class="rowtools"><button class="mini" data-show="${grp}">정답</button><button class="mini chk" data-chk="${grp}" data-next="1">확인</button></div><p class="hintline" data-hint="${grp}"></p>`:""}</div></div>`
 :`<div class="msg me"><div class="av">🧒</div><div class="bub">${m.parts.map(p=>`<div>${p.en.replace(/⟨([^⟩]+)⟩/g,"$1").replace(/\[([^\]]+)\]/g,(x,a)=>`<b style="color:#1d4a8a">${esc(a.split("|")[0])}</b>`)}</div>`).join("")}</div></div>`}
function chatNext(){const box=$("#chat"),cmp=$("#compose");if(!box)return;if(chatStep>=CD.length){cmp.innerHTML=`<div class="done" style="color:var(--navy)">🎉 대화 끝! <button class="btn gold" data-reset>다시 하기</button></div>`;score();return}
 const m=CD[chatStep],grp="chat"+chatStep;
 if(m.who==="mom"){cmp.innerHTML=`<div class="lab">${jo(GD.peerKo||"엄마","이","가")} 쓰는 중…</div>`;box.insertAdjacentHTML("beforeend",`<div class="msg mom" id="typing"><div class="av">${GD.peerAv||"👩"}</div><div class="bub typing"><i></i><i></i><i></i></div></div>`);box.scrollTop=box.scrollHeight;
  chatTimer=setTimeout(()=>{$("#typing")&&$("#typing").remove();box.insertAdjacentHTML("beforeend",bubble(m,grp));speak(plain(m.en),"mom");box.scrollTop=box.scrollHeight;
   if(/\[/.test(m.en)){cmp.innerHTML=`<div class="lab">💬 ${GD.peerKo||"엄마"} 문자 빈칸을 먼저 채워 보세요 (우리말 힌트 보고)</div>`;const f=box.querySelector(`.msg:last-child input`);f&&f.focus()}else{chatStep++;chatNext()}},900);return}
 const has=m.parts.some(p=>/\[/.test(p.en));
 cmp.innerHTML=`<div class="lab">✏️ 내 차례 — ${has?"빈칸을 채우고 문자 전송":"그대로 문자 전송"}</div><div class="draft">${m.parts.map(p=>`<div>${blanks(p.en,grp)}${p.ko?`<span class="ko">(${p.ko})</span>`:""}</div>`).join("")}</div>
  ${bankFor(grp)}<p class="hintline" data-hint="${grp}"></p><div class="send"><span>${has?`<button class="mini" data-show="${grp}">정답 보기</button>`:""}</span><button class="sendbtn" data-send="${grp}">문자 전송 ↑</button></div>`;
 const f=cmp.querySelector("input");f&&f.focus()}
function renderDiary(){let h=`<div class="intro"><p>오른쪽 우리말 일기를 보고 영어 일기를 완성해요.</p><div class="tools"><button class="btn" data-reset>처음부터</button></div></div><div class="diaries">`;
 getData("diary").forEach((d,i)=>{const g="diary"+i;h+=`<div class="diary${LEVEL==="adv"?" adv":""}"><div class="en"><h3><span class="dno">${i+1}</span>${d.d}</h3>${d.en.map((l,j)=>blanks(l,g,LEVEL==="adv"?d.ko[j]:"")).join(" ")}
  ${bankFor(g)}<p class="hintline" data-hint="${g}"></p><div class="rowtools"><button class="mini" data-say="${esc(d.d+". "+d.en.map(plain).join(" "))}">🔊 듣기</button><button class="mini" data-show="${g}">정답 보기</button><button class="mini chk" data-chk="${g}">확인</button></div></div>
  <div class="kr"><h3>${d.kd}</h3>${d.ko.join("<br>")}</div></div>`});
 return h+`</div>`}
function render(){clearTimeout(chatTimer);for(const k in ANS)delete ANS[k];for(const k in WRONG)delete WRONG[k];for(const k in TRIES)delete TRIES[k];uid=0;STATE[tab]={};T0=Date.now();
 document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===tab));
 const W=WORDS[tab];$("#main").innerHTML=(tab==="memo"?renderMemo():tab==="chat"?renderChat():renderDiary())+`<div class="words"><b>Words</b> &nbsp;${W.map(w=>`<span><b>${w[0]}</b> ${w[1]}</span>`).join("")}</div><div class="score"><span id="sc"></span><span class="tools"><button class="btn" data-sendnow style="background:transparent;color:#fff;border-color:rgba(255,255,255,.6)">📮 보내기</button><button class="btn gold" data-allchk>전체 확인</button></span></div>`;
 if(tab==="chat")chatNext();score();prog();whoBar()}
function whoBar(){$("#who").innerHTML=`<span class="me">👤 ${esc(NAME||"이름 없음")}</span><span class="lv">${LVN[LEVEL]}</span><button data-who>바꾸기</button>`}
function openStart(){$("#nm").value=NAME;document.querySelectorAll(".lvb").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lv===LEVEL));$("#start").hidden=false;setTimeout(()=>$("#nm").focus(),50)}
let lastIn=null;document.addEventListener("focusin",e=>{if(e.target.closest&&e.target.closest(".bl"))lastIn=e.target});

document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.who!==undefined){openStart();return}

 if(b.dataset.chip){const g=b.dataset.g;const ins=[...document.querySelectorAll(".bl")].filter(x=>ANS[x.dataset.id]&&ANS[x.dataset.id].g===g&&!x.classList.contains("ok")).map(x=>x.querySelector("input"));
  const t=(lastIn&&ins.includes(lastIn)&&!lastIn.value)?lastIn:ins.find(x=>!x.value)||(ins.includes(lastIn)?lastIn:null);if(!t)return;t.value=b.dataset.chip;b.classList.add("used");const nx=ins.find(x=>!x.value);(nx||t).focus();return}
 if(b.dataset.t){tab=b.dataset.t;render();window.scrollTo({top:0,behavior:"smooth"});return}

 if(b.dataset.say){speak(b.dataset.say);return}

 if(b.dataset.chk){const ok=check(b.dataset.chk);if(ok&&b.dataset.next&&"chat"+chatStep===b.dataset.chk){b.closest(".rowtools").remove();chatStep++;setTimeout(chatNext,700)}return}
 if(b.dataset.send){const g=b.dataset.send,m=CD[chatStep];const has=m.parts.some(p=>/\[/.test(p.en));if(has&&!check(g))return;
  $("#chat").insertAdjacentHTML("beforeend",bubble(m,g));speak(m.parts.map(p=>plain(p.en)).join(" "),"me");const box=$("#chat");box.scrollTop=box.scrollHeight;
  chatStep++;setTimeout(chatNext,500);return}
 if(b.dataset.allchk!==undefined){const gs=[...new Set(Object.values(ANS).map(o=>o.g))];gs.forEach(g=>{if(document.querySelector(`[data-hint="${g}"]`))check(g)});return}
});
document.addEventListener("keydown",e=>{if(e.key!=="Enter"||e.target.tagName!=="INPUT")return;e.preventDefault();const sp=e.target.closest(".bl"),o=ANS[sp.dataset.id];if(!o)return;
 const ins=[...document.querySelectorAll(`.bl`)].filter(x=>ANS[x.dataset.id]&&ANS[x.dataset.id].g===o.g).map(x=>x.querySelector("input"));const i=ins.indexOf(e.target);
 if(i<ins.length-1){ins[i+1].focus();return}
 const sb=document.querySelector(`[data-send="${o.g}"]`)||document.querySelector(`[data-chk="${o.g}"]`);sb&&sb.click()});
/* 기적영트 실습 (2026-11-04): 단원 내용은 gyt/<k>.json · 숙제장 QR: gyt.html?k=p1&s=이름 */
(function(){const Q=new URLSearchParams(location.search),K=(Q.get("k")||"p1").replace(/[^a-z0-9_]/gi,""),S=(Q.get("s")||"").trim();if(S)NAME=S;
 fetch("gyt/"+K+".json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{GD=d;MEMO=d.memo;CHAT=d.chat;DIARY=d.diary;WORDS=d.words;
  $("#gT").textContent=d.title||"기적영트 실습";$("#gS").textContent=d.sub||"";["memo","chat","diary"].forEach(t=>$("#tb_"+t).textContent=(d.tabs||{})[t]||"");document.title=(d.title||"기적영트 실습")+" "+(d.code||"").toUpperCase();
  render();openStart()}).catch(()=>{$("#main").innerHTML='<p class="must">이 단원 내용이 아직 없어요. 선생님께 알려 주세요.</p>'})})();
